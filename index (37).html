<style>
  :root{
    --cream:#FAF5E8;
    --cream-2:#F1E7CE;
    --paper:#FFFDF8;
    --wood:#4A3221;
    --wood-dark:#2E1D12;
    --gold:#B08A3E;
    --gold-light:#D9BE7C;
    --gold-pale:#EFE1BC;
    --ink:#39291A;
    --muted:#8A7454;
    --line:#E3D6B4;
    --danger:#9A3B32;
    --success:#3E6B3A;
    --radius:12px;
    --shadow:0 4px 18px rgba(46,29,18,.10);
    --shadow-lg:0 10px 36px rgba(46,29,18,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Heebo',sans-serif;
    line-height:1.65;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Frank Ruhl Libre',serif;}
  h1,h2,h3{color:var(--wood-dark);margin:0 0 .4em;font-weight:700;}
  a{color:inherit;}
  button{font-family:inherit;}
  img{max-width:100%;display:block;}
  .hidden{display:none !important;}
  .container{max-width:1180px;margin:0 auto;padding:0 24px;}

  /* ---------- Header ---------- */
  header.site-header{
    background:var(--wood-dark);
    color:var(--gold-pale);
    position:sticky;top:0;z-index:40;
    box-shadow:0 2px 12px rgba(0,0,0,.18);
  }
  .header-inner{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;max-width:1180px;margin:0 auto;gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand-mark{
    height:50px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand-mark img{height:100%;width:auto;object-fit:contain;display:block;}
  .hero-logo{max-width:230px;width:60%;margin:0 auto 18px;opacity:0;animation:fadeUp .9s ease-out 0s forwards;}
  .hero-logo img{width:100%;height:auto;object-fit:contain;}
  .brand-text{line-height:1.25;}
  .brand-text .t1{font-family:'Frank Ruhl Libre',serif;font-size:17px;font-weight:700;color:#fff;}
  .brand-text .t2{font-size:12px;color:var(--gold-light);}
  nav.main-nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  nav.main-nav button{
    background:transparent;border:1px solid transparent;color:var(--gold-pale);
    padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer;transition:.15s;
  }
  nav.main-nav button:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);}
  .btn-admin{
    background:var(--gold) !important;color:var(--wood-dark) !important;font-weight:600;
    border-color:var(--gold) !important;
  }
  .btn-admin:hover{background:var(--gold-light) !important;}

  /* ---------- Buttons (general) ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    padding:12px 24px;border-radius:999px;border:1.5px solid var(--wood);
    background:var(--wood);color:#fff;font-size:15px;font-weight:600;cursor:pointer;
    transition:.15s;text-decoration:none;
  }
  .btn:hover{background:var(--wood-dark);}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:var(--wood-dark);}
  .btn-gold:hover{background:var(--gold-light);}
  .btn-outline{background:transparent;color:var(--wood);border-color:var(--wood);}
  .btn-outline:hover{background:var(--wood);color:#fff;}
  .btn-sm{padding:7px 14px;font-size:13px;border-radius:8px;}
  .btn-danger{background:var(--danger);border-color:var(--danger);}
  .btn-danger:hover{background:#7c2c25;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn[disabled]:hover{background:var(--wood);}

  /* ---------- Hero / Home ---------- */
  .hero{
    background:
      radial-gradient(ellipse at top left, rgba(176,138,62,.14), transparent 55%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    padding:76px 24px 90px;text-align:center;position:relative;overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:repeating-linear-gradient(135deg, rgba(176,138,62,.05) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .hero-content{position:relative;max-width:760px;margin:0 auto;}
  .hero-greeting{
    font-family:'Frank Ruhl Libre',serif;font-weight:900;
    font-size:clamp(34px,5vw,54px);color:var(--wood-dark);margin:0;
    opacity:0;animation:fadeUp .9s ease-out .1s forwards;
  }
  .hero-sub{
    font-family:'Frank Ruhl Libre',serif;font-weight:500;font-style:italic;
    font-size:clamp(18px,2.4vw,24px);color:var(--gold);margin:10px 0 8px;
    opacity:0;animation:fadeUp .9s ease-out .5s forwards;
  }
  .hero-desc{
    color:var(--muted);font-size:16px;max-width:520px;margin:14px auto 34px;
    opacity:0;animation:fadeUp .9s ease-out .8s forwards;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .hero-actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
    opacity:0;animation:fadeUp .9s ease-out 1.05s forwards;}
  .hero-actions .btn{min-width:230px;padding:16px 26px;font-size:16px;}

  .divider-orn{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 28px;color:var(--gold);}
  .divider-orn::before,.divider-orn::after{content:"";flex:1;max-width:70px;height:1px;background:var(--line);}

  /* ---------- Quick links strip ---------- */
  .quicklinks{background:var(--paper);border-bottom:1px solid var(--line);}
  .quicklinks .container{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;padding:18px 24px;}
  .quicklinks button{
    background:none;border:none;color:var(--wood);font-size:14.5px;cursor:pointer;
    display:flex;align-items:center;gap:7px;padding:6px 4px;border-bottom:2px solid transparent;
  }
  .quicklinks button:hover{border-color:var(--gold);color:var(--gold);}

  /* ---------- Sections generic ---------- */
  .section{padding:52px 24px;}
  .section-narrow{max-width:820px;margin:0 auto;}
  .eyebrow{color:var(--gold);font-size:13px;letter-spacing:.02em;margin-bottom:6px;}
  .lead{color:var(--muted);max-width:640px;margin:0 auto 30px;text-align:center;}

  /* ---------- About cards on home ---------- */
  .about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;max-width:1000px;margin:0 auto;}
  .about-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:24px;text-align:center;}
  .about-card i{font-size:26px;color:var(--gold);margin-bottom:10px;}
  .about-card h3{font-size:17px;margin-bottom:6px;}
  .about-card p{color:var(--muted);font-size:14px;margin:0;}

  /* ---------- Footer ---------- */
  footer.site-footer{background:var(--wood-dark);color:var(--gold-pale);padding:34px 24px 22px;margin-top:40px;}
  footer .container{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;}
  footer .f-col h4{color:#fff;font-size:14px;margin:0 0 10px;font-family:'Frank Ruhl Libre',serif;}
  footer .f-col p, footer .f-col button{color:var(--gold-light);font-size:13px;margin:0 0 6px;background:none;border:none;padding:0;cursor:pointer;text-align:right;display:block;}
  footer .f-col button:hover{color:#fff;text-decoration:underline;}
  .footer-bottom{text-align:center;color:#8a7a5f;font-size:12px;margin-top:24px;border-top:1px solid rgba(255,255,255,.08);padding-top:16px;}

  /* ---------- Smart AI search ---------- */
  .smart-search-wrap{max-width:1180px;margin:0 auto;padding:26px 24px 0;}
  .smart-search-card{
    position:relative;
    background:linear-gradient(150deg, #3c2818 0%, var(--wood-dark) 55%, #241509 100%);
    border-radius:20px;padding:28px 30px;color:#fff;
    box-shadow:0 18px 40px rgba(20,12,5,.4), inset 0 1px 0 rgba(255,255,255,.06);
    border:1px solid rgba(217,190,124,.25);
    overflow:hidden;
  }
  .smart-search-card::before{
    content:'';position:absolute;top:-60%;left:-20%;width:280px;height:280px;
    background:radial-gradient(circle, rgba(217,190,124,.16) 0%, transparent 70%);
    pointer-events:none;
  }
  .smart-search-head{display:flex;align-items:center;gap:12px;margin-bottom:6px;position:relative;}
  .smart-search-badge{
    flex-shrink:0;width:42px;height:42px;border-radius:50%;
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 12px rgba(217,190,124,.4);
  }
  .smart-search-badge i{color:var(--wood-dark);font-size:17px;}
  .smart-search-card h3{color:#fff;font-size:17.5px;margin:0;font-weight:700;}
  .smart-search-card p{color:var(--gold-pale);font-size:13.5px;margin:0 0 18px;line-height:1.55;position:relative;}
  .smart-search-row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;position:relative;}
  .smart-search-row textarea{
    flex:1;min-width:240px;border:1px solid rgba(255,255,255,.2);border-radius:12px;
    padding:13px 16px;font-family:inherit;font-size:14.5px;background:rgba(255,255,255,.07);color:#fff;
    min-height:56px;resize:vertical;transition:border-color .2s, background .2s;
  }
  .smart-search-row textarea::placeholder{color:rgba(255,255,255,.5);}
  .smart-search-row textarea:focus{outline:none;border-color:var(--gold-light);background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(217,190,124,.18);}
  .smart-search-row .btn-gold{
    align-self:center;white-space:nowrap;padding:14px 26px;font-size:14.5px;font-weight:700;
    box-shadow:0 8px 20px rgba(176,138,62,.4);transition:transform .15s;
  }
  .smart-search-row .btn-gold:hover{transform:translateY(-2px);}
  .smart-search-result{margin-top:16px;background:rgba(255,255,255,.07);border-radius:12px;padding:16px 18px;font-size:14px;display:none;border-right:3px solid var(--gold-light);}
  .smart-search-result.show{display:block;}
  .smart-search-result .note{color:var(--gold-pale);margin:0 0 6px;}
  .smart-loading{display:none;align-items:center;gap:8px;color:var(--gold-pale);font-size:13.5px;margin-top:12px;}
  .smart-loading.show{display:flex;}
  .spin{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Search / Filters ---------- */
  .search-hero{background:var(--wood-dark);padding:34px 24px;}
  .search-hero h1{color:#fff;font-size:26px;margin-bottom:4px;}
  .search-hero p{color:var(--gold-light);margin:0;font-size:14px;}
  .filters-bar{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin:-26px auto 30px;max-width:1180px;
    display:grid;grid-template-columns:repeat(6,1fr);gap:12px;position:relative;z-index:2;
  }
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12px;color:var(--muted);}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;
    font-family:inherit;background:var(--paper);color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--gold-light);border-color:var(--gold);}
  .results-meta{display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:0 auto 16px;padding:0 24px;color:var(--muted);font-size:14px;flex-wrap:wrap;gap:8px;}
  .results-meta a{color:var(--wood);cursor:pointer;text-decoration:underline;}
  .results-grid{max-width:1180px;margin:0 auto;padding:0 24px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px;}
  .place-card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);display:flex;flex-direction:column;transition:.15s;
  }
  .place-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
  .place-thumb{
    height:170px;background:linear-gradient(135deg,var(--gold-pale),var(--cream-2));
    display:flex;align-items:center;justify-content:center;position:relative;
    background-size:cover;background-position:center;
  }
  .place-thumb i{font-size:34px;color:var(--gold);}
  .place-rating{
    position:absolute;top:10px;left:10px;background:var(--wood-dark);color:var(--gold-light);
    font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;
  }
  .place-cat{
    position:absolute;top:10px;right:10px;background:rgba(255,253,248,.92);color:var(--wood);
    font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;
  }
  .place-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .place-body h3{font-size:18px;margin:0;}
  .place-en{color:var(--muted);font-size:12.5px;margin:-4px 0 2px;}
  .place-meta{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .place-excerpt{font-size:13.5px;color:#5c4c37;margin:4px 0 10px;flex:1;}
  .empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state i{font-size:38px;color:var(--gold-light);margin-bottom:10px;}

  /* ---------- Floating ad ---------- */
  .ad-overlay{
    position:fixed;inset:0;background:rgba(46,29,18,.55);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .ad-box{background:var(--paper);border-radius:var(--radius);max-width:440px;width:100%;position:relative;box-shadow:var(--shadow-lg);overflow:hidden;}
  .ad-box.has-media{max-width:90vw;width:auto;display:inline-flex;flex-direction:column;max-height:92vh;}
  .ad-close{position:absolute;top:10px;left:10px;background:rgba(46,29,18,.75);color:#fff;border:none;
    width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;z-index:2;}
  .ad-img{display:block;max-width:90vw;max-height:75vh;width:auto;height:auto;object-fit:contain;margin:0 auto;background:var(--paper);}
  .ad-pdf-frame{width:min(90vw,700px);height:min(75vh,600px);border:0;display:block;}
  .ad-textbox{padding:26px 22px;text-align:center;}
  .ad-textbox h3{margin-bottom:8px;}

  /* ---------- Place detail ---------- */
  .detail-wrap{max-width:920px;margin:0 auto;padding:30px 24px 70px;}
  .detail-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  #printArea{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
  .detail-header{
    background:var(--wood-dark);color:#fff;padding:26px 30px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;
  }
  .detail-header .dh-title h1{color:#fff;font-size:26px;margin-bottom:2px;}
  .detail-header .dh-title .en{color:var(--gold-light);font-size:14px;}
  .detail-header .dh-meta{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{background:rgba(255,255,255,.14);color:var(--gold-pale);font-size:12.5px;padding:5px 12px;border-radius:999px;}
  .dh-rating{background:var(--gold);color:var(--wood-dark);font-weight:700;font-size:15px;padding:8px 16px;border-radius:10px;text-align:center;min-width:70px;}
  .dh-rating small{display:block;font-weight:400;font-size:10.5px;}
  .gallery{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;padding:6px;}
  .gallery img{width:100%;height:190px;object-fit:cover;border-radius:4px;cursor:pointer;}
  .gallery .g-main{grid-row:span 2;height:100%;min-height:390px;}
  .detail-sections{padding:8px 30px 30px;}
  .d-section{padding:18px 0;border-bottom:1px solid var(--line);}
  .d-section:last-child{border-bottom:none;}
  .d-section h3{display:flex;align-items:center;gap:9px;font-size:16.5px;margin-bottom:8px;}
  .d-section h3 i{color:var(--gold);font-size:16px;}
  .d-section .body-text{color:#4a3c29;font-size:14.5px;white-space:pre-line;}
  .map-frame{width:100%;height:280px;border:0;border-radius:8px;}
  .no-map{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px;}
  .lightbox{position:fixed;inset:0;background:rgba(20,13,7,.9);z-index:300;display:flex;align-items:center;justify-content:center;padding:26px;}
  .lightbox img{max-height:90vh;max-width:90vw;border-radius:6px;}
  .lightbox button{position:absolute;top:22px;left:22px;background:rgba(255,255,255,.15);color:#fff;border:none;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;}

  /* ---------- Forms (contact/suggest/admin) ---------- */
  .form-card{max-width:640px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:34px;}
  .form-card h2{text-align:center;}
  .form-card .form-lead{text-align:center;color:var(--muted);margin-bottom:24px;font-size:14.5px;}
  .form-row{margin-bottom:16px;display:flex;flex-direction:column;gap:6px;}
  .form-row label{font-size:14px;font-weight:500;}
  .form-row input,.form-row select,.form-row textarea{
    border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:14.5px;font-family:inherit;
    background:var(--cream);color:var(--ink);
  }
  .form-row textarea{min-height:100px;resize:vertical;}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:2px solid var(--gold-light);border-color:var(--gold);background:var(--paper);}
  .rich-editor-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--cream);}
  .rich-toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#f1e7ce;border-bottom:1px solid var(--line);}
  .rich-toolbar select,.rich-toolbar input[type=color]{border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12.5px;background:#fff;cursor:pointer;}
  .rich-toolbar input[type=color]{width:34px;padding:2px;height:30px;}

function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* מעקב פעילות אתר — רישום שקט של אירועים (לא חוסם, לא מציג שגיאות למשתמש) */
function trackEvent(type, meta){
  try{
    sb.from('analytics_events').insert({ id: uid(), event_type: type, meta: meta||{} })
      .then(()=>{}, ()=>{});
  }catch(e){ /* לא מפריעים לחוויית המשתמש בגלל כשל במעקב */ }
}

/* ========================= שכבת הנתונים (Supabase) =========================
   מבנה הטבלאות (ראו הוראות ההתקנה ליצירתן):
   - places(id text pk, status text, "order" int, data jsonb)      -- קריאה ציבורית, כתיבה למנהל בלבד
   - settings(id int pk, data jsonb)                                -- קריאה ציבורית, כתיבה למנהל בלבד
   - messages(id text pk, status text, data jsonb)                  -- כתיבה (הוספה) ציבורית, קריאה למנהל בלבד
   - suggestions(id text pk, status text, data jsonb)                -- כתיבה (הוספה) ציבורית, קריאה למנהל בלבד
   כל השדות המפורטים של כל רשומה (שם, עיר, תיאור וכו') נשמרים בעמודת ה-JSON "data",
   כדי לשמור על התאמה מלאה למבנה האובייקטים המקורי של האתר. */

function placeRowToObj(row){ return { id: row.id, status: row.status, order: row.order, ...(row.data||{}) }; }
function placeObjToRow(p){ const {id, status, order, ...data} = p; return { id, status, order: order||0, data }; }
function simpleRowToObj(row){ return { id: row.id, status: row.status, ...(row.data||{}) }; }
function simpleObjToRow(o){ const {id, status, ...data} = o; return { id, status, data }; }

async function upsertPlaceRow(p, isNew){
  const { error } = await sb.from('places').upsert(placeObjToRow(p), {onConflict:'id'});
  if(error){ console.error('upsert place failed', error); alert('שמירת המקום נכשלה: '+error.message); }
  else logAdminAction(isNew?'הוספת מקום':'עדכון מקום', p.nameHe||p.id, {placeId:p.id, city:p.city});
  return !error;
}
async function deletePlaceRow(id){
  const p = DB.places.find(x=>x.id===id);
  const { error } = await sb.from('places').delete().eq('id', id);
  if(error){ console.error('delete place failed', error); alert('מחיקת המקום נכשלה: '+error.message); }
  else logAdminAction('מחיקת מקום', (p&&p.nameHe)||id, {placeId:id});
  return !error;
}
async function saveSettingsRow(){
  const { error } = await sb.from('settings').upsert({id:1, data:DB.settings}, {onConflict:'id'});
  if(error){ console.error('save settings failed', error); alert('שמירת ההגדרות נכשלה: '+error.message); }
  else logAdminAction('עדכון הגדרות אתר', 'settings', {});
  return !error;
}

let DB = { places:[], messages:[], suggestions:[], settings:null };
let liveChannelsAttached = false;

async function loadDB(){
  const { data: placeRows, error: placesErr } = await sb.from('places').select('*').order('order', {ascending:true});
  if(placesErr) throw placesErr;
  if(!placeRows || !placeRows.length){
    // אתחול ראשוני של המאגר עם נתוני הדוגמה (פעם אחת בלבד, כשהטבלה ריקה)
    const seedRows = SEED_PLACES.map(placeObjToRow);
    await sb.from('places').upsert(seedRows, {onConflict:'id'});
    DB.places = SEED_PLACES;
  } else {
    DB.places = placeRows.map(placeRowToObj);
  }

  const { data: settingsRow } = await sb.from('settings').select('*').eq('id',1).maybeSingle();
  if(!settingsRow){
    await sb.from('settings').upsert({id:1, data:DEFAULT_SETTINGS});
    DB.settings = DEFAULT_SETTINGS;
  } else {
    // מיזוג עם ברירות המחדל — כך שמפתחות הגדרה חדשים (שנוספו בעדכון קוד) יקבלו ערך גם באתרים קיימים שכבר שמרו הגדרות בעבר
    DB.settings = {...DEFAULT_SETTINGS, ...(settingsRow.data||{})};
  }
  DB.messages = [];
  DB.suggestions = [];
}

/* טעינת פניות/הצעות — מוגבל למנהל מחובר בלבד (RLS חוסם קריאה לאחרים) */
async function loadMessagesForAdmin(){
  const { data, error } = await sb.from('messages').select('*').order('id', {ascending:false});
  if(error){ console.error('load messages failed', error); DB.messages = []; return; }
  DB.messages = (data||[]).map(simpleRowToObj);
}
async function loadSuggestionsForAdmin(){
  const { data, error } = await sb.from('suggestions').select('*').order('id', {ascending:false});
  if(error){ console.error('load suggestions failed', error); DB.suggestions = []; return; }
  DB.suggestions = (data||[]).map(simpleRowToObj);
}

/* עדכון בזמן אמת: כל שינוי במקומות/הגדרות מגיע מיידית לכל הגולשים, בלי רענון */
function attachLiveListeners(){
  if(liveChannelsAttached) return;
  liveChannelsAttached = true;
  sb.channel('public:places')
    .on('postgres_changes', {event:'*', schema:'public', table:'places'}, async ()=>{
      const { data } = await sb.from('places').select('*').order('order', {ascending:true});
      DB.places = (data||[]).map(placeRowToObj);
      if(['home','search','place'].includes(state.view)) render();
    }).subscribe();
  sb.channel('public:settings')
    .on('postgres_changes', {event:'*', schema:'public', table:'settings'}, async ()=>{
      const { data } = await sb.from('settings').select('*').eq('id',1).maybeSingle();
      DB.settings = (data && data.data) || DEFAULT_SETTINGS;
      if(state.view==='home') refreshDesktopBtn();
      refreshGroomFab();
    }).subscribe();
}

let state = { view:'home', filters:{q:'',category:'',city:'',region:'',minRating:'',sort:'manual'},

const app = document.getElementById('app');

function go(view, extra){
  state.view = view;
  if(extra) Object.assign(state, extra);
  window.scrollTo({top:0,behavior:'instant'});
  render();
  renderCompareBar();
  updateUrlForState();
  if(view !== 'admin' && view !== 'place') trackEvent('page_view', {view});
}
/* ========================= קישורים ישירים (כתובת אמיתית בדפדפן לכל עמוד/מקום) =========================
   כך שאפשר לשלוח קישור למקום ספציפי, ורענון הדף לא מחזיר אותנו לדף הבית. */
function updateUrlForState(){
  const params = new URLSearchParams();
  if(state.view !== 'home') params.set('v', state.view);
  if(state.view === 'place' && state.activePlaceId) params.set('id', state.activePlaceId);
  const qs = params.toString();
  const newUrl = window.location.pathname + (qs ? ('?'+qs) : '');
  const current = window.location.pathname + window.location.search;
  if(newUrl !== current){
    history.pushState({view:state.view, activePlaceId:state.activePlaceId}, '', newUrl);
  }
}
function restoreStateFromUrl(){
  const params = new URLSearchParams(window.location.search);
  const v = params.get('v');
  const id = params.get('id');
  if(v){
    state.view = v;
    if(v === 'place' && id) state.activePlaceId = id;
  }
}
window.addEventListener('popstate', (e)=>{
  if(e.state){
    state.view = e.state.view || 'home';
    state.activePlaceId = e.state.activePlaceId || null;
  } else {
    state.view = 'home';
    restoreStateFromUrl();
  }
  render();
  renderCompareBar();
});

async function init(){
  app.innerHTML = '<div style="padding:80px;text-align:center;color:var(--muted);">טוען מאגר מידע...</div>';
  try{
    await loadDB();
  }catch(e){
    console.error('loadDB failed', e);
    app.innerHTML = '<div style="padding:80px;text-align:center;color:var(--muted);">שגיאה בטעינת המאגר. יש לרענן את הדף. אם הבעיה חוזרת, יש לבדוק את הגדרות ה-Supabase.</div>';
    return;
  }
  attachLiveListeners();
  restoreStateFromUrl();
  render();
  refreshGroomFab();
  applyOfflineAccessVisibility();
  maybeShowAd();
  trackEvent('page_view', {view: state.view});
}

const RECENT_VIEWED_KEY = 'zman_recent_places';
function trackRecentlyViewed(placeId){
  try{
    let arr = JSON.parse(localStorage.getItem(RECENT_VIEWED_KEY)||'[]');
    arr = arr.filter(id=>id!==placeId);
    arr.unshift(placeId);
    localStorage.setItem(RECENT_VIEWED_KEY, JSON.stringify(arr.slice(0,8)));
  }catch(e){ /* אם האחסון המקומי חסום (מצב פרטי וכו') — פשוט מדלגים, לא קריטי */ }
}
function getRecentlyViewedPlaces(){

/* ========================= התקנה כאפליקציה (PWA אמיתי) =========================
   כשהדפדפן מזהה שהאתר עומד בתנאי ההתקנה (יש manifest.json + service worker + HTTPS),
   הוא שולח אירוע beforeinstallprompt. שומרים אותו כאן, ומציגים את הכפתור רק אז —
   כך שהכפתור מפעיל את חלון ההתקנה האמיתי של הדפדפן, ולא קישור להורדת קובץ. */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  refreshDesktopBtn();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  refreshDesktopBtn();
});
function refreshDesktopBtn(){
  const alreadyInstalled = window.matchMedia('(display-mode: standalone)').matches;
  const b = document.getElementById('desktopBtn');
  if(b) b.style.display = (deferredInstallPrompt && !alreadyInstalled) ? 'inline-flex' : 'none';
  const pwaBtn = document.getElementById('pwaInstallBtn');
  if(pwaBtn) pwaBtn.disabled = !deferredInstallPrompt;
}
async function downloadDesktop(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  refreshDesktopBtn();
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.error('SW registration failed', err));
  });
}

async function loadAndRenderAnalytics(c){
  const since = new Date(Date.now() - _analyticsRangeDays*24*60*60*1000).toISOString();
  const { data, error } = await sb.from('analytics_events')
    .select('*')
    .gte('created_at', _analyticsRangeDays===0 ? '2000-01-01' : since)
    .order('created_at', {ascending:false})
    .limit(8000);
  if(error){
    c.innerHTML = `<p style="padding:20px;color:#a33;">טעינת הנתונים נכשלה: ${escapeHtml(error.message)}<br><span class="small-note">ייתכן שטבלת analytics_events עדיין לא נוצרה — יש להריץ את קובץ ה-SQL שסופק.</span></p>`;
    return;
  }
  const events = data || [];
  _lastAnalyticsEvents = events; // נשמר בזיכרון כדי לאפשר ייצוא של אותם הנתונים המוצגים
  const pageViews = events.filter(e=>e.event_type==='page_view');
  const placeViews = events.filter(e=>e.event_type==='place_view');
  const searches = events.filter(e=>e.event_type==='search');
  const noResultSearches = events.filter(e=>e.event_type==='search_no_results');

  // חיפושים שלא הניבו תוצאות — מרוכזים לפי שאילתה, כדי להראות אילו סוגי מקומות מחפשים ואין במאגר
  const noResultCounts = {};
  noResultSearches.forEach(e=>{
    const q = ((e.meta&&e.meta.query)||'').trim();
    if(!q) return;
    noResultCounts[q] = (noResultCounts[q]||0)+1;
  });
  const topNoResults = Object.entries(noResultCounts).sort((a,b)=>b[1]-a[1]).slice(0,15);

  // מגמה יומית (לגרף) — סופרים כמה אירועים מכל סוג התרחשו בכל יום בטווח שנבחר
  const trendDays = _analyticsRangeDays===0 ? 30 : Math.min(_analyticsRangeDays, 60);
  const dayBuckets = [];
  for(let i=trendDays-1;i>=0;i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    dayBuckets.push({date:d, key:d.toISOString().slice(0,10), pv:0, sv:0});

  events.forEach(e=>{

    const i = bucketIndex[key];

  const viewCounts = {};

  // חיפושים אחרונים
  const recentSearches = searches.slice(0,25);

  <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" onclick="exportAnalyticsCSV()"><i class="fa-solid fa-file-csv"></i> ייצוא נתוני שימוש (CSV)</button>

      <option value="30" ${_analyticsRangeDays===30?'selected':''}>30 ימים אחרונים</option>
      <option value="90" ${_analyticsRangeDays===90?'selected':''}>90 ימים אחרונים</option>
      <option value="0" ${_analyticsRangeDays===0?'selected':''}>מאז ומתמיד</option>
    </select>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="num">${pageViews.length}</div><div class="lbl">צפיות בעמודים (${rangeLabel})</div></div>
    <div class="stat-card"><div class="num">${placeViews.length}</div><div class="lbl">צפיות בעמודי מקומות</div></div>
    <div class="stat-card"><div class="num">${searches.length}</div><div class="lbl">חיפושים חכמים בוצעו</div></div>
    <div class="stat-card"><div class="num">${Object.keys(placeCounts).length}</div><div class="lbl">מקומות שונים נצפו</div></div>
  </div>

      <tbody>${topPlaces.map(([id,d],i)=>`<tr><td>${i+1}</td><td>${escapeHtml(d.name)}</td><td>${escapeHtml(d.city)}</td><td>${d.count}</td></tr>`).join('')}</tbody>

function renderTrendSVG(buckets){
  if(!buckets.length) return '<p class="small-note">אין עדיין נתונים.</p>';
  const w = 700, h = 200, pad = 30;
  const maxVal = Math.max(1, ...buckets.map(b=>Math.max(b.pv,b.sv)));
  const stepX = (w - pad*2) / Math.max(1, buckets.length-1);
  const toXY = (i,val)=>({ x: pad + i*stepX, y: h - pad - (val/maxVal)*(h-pad*2) });
  const pvPoints = buckets.map((b,i)=>toXY(i,b.pv));
  const svPoints = buckets.map((b,i)=>toXY(i,b.sv));
  const toPath = pts => pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const labelEvery = Math.max(1, Math.ceil(buckets.length/8));
  const labels = buckets.map((b,i)=> i%labelEvery===0 ? `<text x="${toXY(i,0).x.toFixed(1)}" y="${h-8}" font-size="9" fill="#8A7454" text-anchor="middle">${b.date.getDate()}/${b.date.getMonth()+1}</text>` : '').join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:240px;">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#E3D6B4"></line>
    <path d="${toPath(pvPoints)}" fill="none" stroke="#B08A3E" stroke-width="2"></path>
    <path d="${toPath(svPoints)}" fill="none" stroke="#4A3221" stroke-width="2"></path>
    ${labels}
  </svg>
  <div style="display:flex;gap:16px;margin-top:6px;font-size:12px;">
    <span><span style="display:inline-block;width:10px;height:10px;background:#B08A3E;border-radius:2px;margin-left:5px;"></span>צפיות בעמודים</span>
    <span><span style="display:inline-block;width:10px;height:10px;background:#4A3221;border-radius:2px;margin-left:5px;"></span>צפיות במקומות</span>
  </div>`;
}
function csvEscape(v){
  const s = (v===null||v===undefined) ? '' : String(v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
function exportAnalyticsCSV(){
  const events = _lastAnalyticsEvents;
  if(!events.length){ alert('אין נתוני שימוש להורדה בטווח הזמן שנבחר.'); return; }
  const header = ['id','event_type','created_at','meta'];
  const rows = events.map(e=>[e.id, e.event_type, e.created_at, JSON.stringify(e.meta||{})]);
  const csv = '\uFEFF'+[header, ...rows].map(r=>r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `zman-simchateinu-analytics-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
function exportAnalyticsJSON(){
  const events = _lastAnalyticsEvents;
  if(!events.length){ alert('אין נתוני שימוש להורדה בטווח הזמן שנבחר.'); return; }
  const blob = new Blob([JSON.stringify(events, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `zman-simchateinu-analytics-${new Date().toISOString().slice(0,10)}.json`;

}

const RICH_FONTS = ['Assistant','Arial','Georgia','Tahoma','Times New Roman','Courier New','Verdana'];
function richEditorHTML(fieldId, initialHTML){
  return `
  <div class="rich-editor-wrap" data-field="${fieldId}">

function insertRichBlock(fieldId, tag){
  const el = document.getElementById(fieldId);
  if(!el) return;
  el.focus();
  const placeholders = {h3:'כותרת חדשה', h4:'כותרת משנה', p:'טקסט חדש...'};
  const html = `<${tag}>${placeholders[tag]||''}</${tag}><p><br></p>`;
  const sel = window.getSelection();
  let inserted = false;
  if(sel && sel.rangeCount && el.contains(sel.anchorNode)){
    document.execCommand('insertHTML', false, html);
    inserted = true;
  }
  if(!inserted){
    el.insertAdjacentHTML('beforeend', html);
  }
}
function getRichEditorHTML(fieldId){
  const el = document.getElementById(fieldId);
  return el ? el.innerHTML.trim() : '';
}

/* ========================= הצעת תיאור אוטומטית =========================
   בונה סיכום קצר על סמך שאר השדות שכבר מולאו (עיר, קטגוריה, ישיבה, אוכל ושתייה, שירותים, טיולים בסביבה, דירוג).
   זהו הרכבה מבוססת-כללים מהמידע הקיים (לא בינה מלאכותית אמיתית) — באותה רוח כמו "החיפוש החכם" באתר. */
function firstWords(text, n){
  const words = (text||'').split(/\s+/).filter(Boolean);
  if(!words.length) return '';
  return words.slice(0,n).join(' ') + (words.length>n?'...':'');
}
function buildDescriptionSuggestion(data){
  const catLabel = data.category || 'מקום';
  const namePart = data.nameHe ? `"${data.nameHe}" ` : '';
  const cityPart = data.city ? ` ב${data.city}` : '';
  const regionPart = data.region ? `, באזור ${data.region}` : '';
  if(!data.city && !data.category && !stripHtmlTags(data.seating) && !stripHtmlTags(data.foodDrink)
     && !stripHtmlTags(data.services) && !stripHtmlTags(data.nearbyTrips) && !data.rating){
    return '';
  }
  const opening = `${catLabel} ${namePart}${cityPart?('הממוקם'+cityPart):''}${regionPart}.`.replace(/^\s+/,'');
  const bits = [];
  const seating = stripHtmlTags(data.seating);
  if(seating) bits.push(`המקום כולל ${firstWords(seating, 18)}`);
  const food = stripHtmlTags(data.foodDrink);
  if(food) bits.push(`מוצעת אפשרות ל${firstWords(food, 15)}`);
  const services = stripHtmlTags(data.services);
  if(services) bits.push(`בין השירותים הזמינים: ${firstWords(services, 15)}`);
  const nearby = stripHtmlTags(data.nearbyTrips);
  if(nearby) bits.push(`בסביבה הקרובה ניתן למצוא ${firstWords(nearby, 15)}`);
  let ratingLine = '';
  if(data.rating){
    const tier = data.rating>=9?'מומלץ מאוד':data.rating>=7?'מומלץ':data.rating>=5?'סביר':'';
    if(tier) ratingLine = `המקום מדורג ${tier} על ידי הצוות (${data.rating}/10).`;
  }
  return [opening, bits.length?bits.join('. ')+'.':'', ratingLine].filter(Boolean).join(' ');
}
function suggestDescriptionFromForm(){
  const data = {
    nameHe: document.getElementById('m_nameHe').value.trim(),
    category: document.getElementById('m_category').value,
    city: document.getElementById('m_city').value.trim(),
    region: document.getElementById('m_region').value,
    seating: getRichEditorHTML('m_seating'),
    foodDrink: getRichEditorHTML('m_foodDrink'),
    services: getRichEditorHTML('m_services'),
    nearbyTrips: getRichEditorHTML('m_nearbyTrips'),
    rating: Number(document.getElementById('m_rating').value)||0,
  };
  const suggestion = buildDescriptionSuggestion(data);
  const box = document.getElementById('descSuggestionBox');
  if(!suggestion){
    box.innerHTML = '<p class="small-note" style="color:#a33;margin-top:6px;">יש למלא קודם כמה פרטים נוספים (עיר, קטגוריה, ישיבה, אוכל ושתייה, שירותים וכו׳) כדי שנוכל להציע תיאור על סמכם.</p>';
    return;
  }
  box.innerHTML = `
    <div style="background:#f7f1e3;border-radius:8px;padding:10px 12px;margin-top:6px;">
      <div class="small-note" style="margin-bottom:6px;">הצעת תיאור על סמך שאר הפרטים (ניתן לערוך לפני שימוש):</div>
      <textarea id="descSuggestionText" style="min-height:80px;">${escapeHtml(suggestion)}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button type="button" class="btn btn-gold btn-sm" onclick="applyDescriptionSuggestion()">שימוש בהצעה זו</button>
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('descSuggestionBox').innerHTML=''">ביטול</button>
      </div>
    </div>`;
}
function applyDescriptionSuggestion(){
  const textEl = document.getElementById('descSuggestionText');
  const text = textEl ? textEl.value.trim() : '';
  if(!text) return;
  const editor = document.getElementById('m_description');
  if(editor.innerText.trim() && !confirm('יש כבר תיאור קיים בשדה. להחליף אותו בהצעה החדשה?')) return;
  editor.innerHTML = escapeHtml(text).replace(/\n/g,'<br>');
  document.getElementById('descSuggestionBox').innerHTML = '';
}

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ========================= הגנה בסיסית מפני בוטים/ספאם בטפסים הציבוריים ========================= */
/* שדה "מלכודת" (honeypot): מוסתר מבני אדם באמצעות CSS (לא display:none, כדי שבוטים פשוטים לא ידלגו עליו),
   אבל בוטים שממלאים אוטומטית כל שדה בטופס יתפסו בו. אם יש בו ערך — מדובר כמעט בוודאות בבוט, ומתעלמים בשקט מהשליחה. */
function honeypotFieldHTML(fieldId){

    <label>השאירו שדה זה ריק</label>
    <input type="text" id="${fieldId}" name="${fieldId}" tabindex="-1" autocomplete="off">
  </div>`;

function isHoneypotTriggered(fieldId){

/* צינון קצר בין שליחות טופס מאותו סוג — מונע לחיצה כפולה בטעות/הצפה, בנוסף להגנת ה-honeypot נגד בוטים */
function isFormOnCooldown(key, seconds){
  try{
    const last = Number(localStorage.getItem('zman_form_cd_'+key) || 0);
    return (Date.now() - last) < seconds*1000;
  }catch(e){ return false; }
}
function setFormCooldown(key){

function buildTransitUrl(p){
  if(p.lat && p.lng){
    return `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=transit`;
  }
  let dest = '';
  if(p.address && p.address.trim()){
    dest = p.address.trim();
    if(p.city && !dest.includes(p.city)) dest += `, ${p.city}`;
  } else if(p.nameHe || p.nameEn){
    dest = (p.nameHe || p.nameEn) + (p.city ? `, ${p.city}` : '');
  }
  if(!dest) return null;
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=transit`;
}

/* ========================= תכנון מסלול הגעה חכם =========================
   בונה קישור לגוגל מפות עם מוצא (מה שהמשתמש הזין, או המיקום הנוכחי שלו) ויעד (כתובת/מיקום המקום),
   כך שגוגל מפות עצמו מחשב ניווט מדויק ומעודכן בזמן אמת — בלי להזדקק ל-Google Directions API בתשלום. */
function buildDrivingUrl(p, origin){
  let dest = '';
  if(p.lat && p.lng) dest = `${p.lat},${p.lng}`;
  else if(p.address && p.address.trim()){
    dest = p.address.trim();
    if(p.city && !dest.includes(p.city)) dest += `, ${p.city}`;
  } else if(p.nameHe || p.nameEn){
    dest = (p.nameHe || p.nameEn) + (p.city ? `, ${p.city}` : '');
  }
  if(!dest) return null;
  let url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=driving`;
  if(origin && origin.trim()) url += `&origin=${encodeURIComponent(origin.trim())}`;
  return url;
}
function useMyLocationForRoute(){
  const msg = document.getElementById('routeMsg');
  const originInput = document.getElementById('routeOrigin');
  if(!navigator.geolocation){ if(msg) msg.textContent = 'הדפדפן שלכם לא תומך באיתור מיקום.'; return; }
  if(msg) msg.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> מאתר את המיקום שלכם...';
  navigator.geolocation.getCurrentPosition(
    pos=>{
      if(originInput) originInput.value = `${pos.coords.latitude},${pos.coords.longitude}`;
      if(msg) msg.textContent = 'המיקום נמצא! אפשר ללחוץ על "חישוב מסלול בתחבורה ציבורית".';
    },
    ()=>{ if(msg) msg.textContent = 'לא הצלחנו לאתר את המיקום שלכם. אפשר להקליד ידנית נקודת יציאה, או ללחוץ ישירות על "ניווט לרכב פרטי בגוגל מפות" — גוגל מפות תבקש מיקום בעצמה.'; },
    {timeout:8000}
  );
}
/* חישוב מרחק/זמן נסיעה בתוך העמוד עצמו, דרך Google Directions API (ראו GOOGLE_MAPS_API_KEY למעלה).
   שימו לב: לא נוצר כאן אובייקט google.maps.Map בכלל (רק DirectionsService) — כך שלא נגרם חיוב על "טעינת מפה" (Dynamic Maps),
   רק על בקשת המסלול עצמה (Directions), שכוללת 10,000 בקשות חינמיות בחודש. */
const TRANSIT_VEHICLE_HE = {
  BUS:'אוטובוס', TRAM:'רכבת קלה', SUBWAY:'רכבת תחתית', HEAVY_RAIL:'רכבת', COMMUTER_TRAIN:'רכבת',
  HIGH_SPEED_TRAIN:'רכבת מהירה', RAIL:'רכבת', METRO_RAIL:'רכבת תחתית', SHARE_TAXI:'מונית שירות', FERRY:'מעבורת'
};
const TRANSIT_VEHICLE_ICON = {
  BUS:'fa-bus', TRAM:'fa-train-tram', SUBWAY:'fa-train-subway', HEAVY_RAIL:'fa-train',
  COMMUTER_TRAIN:'fa-train', HIGH_SPEED_TRAIN:'fa-train', RAIL:'fa-train', METRO_RAIL:'fa-train-subway',
  SHARE_TAXI:'fa-taxi', FERRY:'fa-ship'
};
function buildRouteStepsHTML(leg, isTransit){
  if(!leg.steps || !leg.steps.length) return '<p class="small-note">אין פירוט שלבים זמין.</p>';
  const rows = leg.steps.map((step, i)=>{
    if(isTransit && step.travel_mode === 'TRANSIT' && step.transit){
      const t = step.transit;
      const vehicleType = (t.line.vehicle && t.line.vehicle.type) || 'BUS';
      const vehicleHe = TRANSIT_VEHICLE_HE[vehicleType] || 'תחבורה ציבורית';
      const vehicleIcon = TRANSIT_VEHICLE_ICON[vehicleType] || 'fa-bus';
      const lineName = t.line.short_name || t.line.name || '';
      const depTime = t.departure_time ? t.departure_time.text : '';
      const arrTime = t.arrival_time ? t.arrival_time.text : '';
      const timesHTML = (depTime && arrTime) ? ` · יציאה ${escapeHtml(depTime)} ← הגעה ${escapeHtml(arrTime)}` : '';
      return `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #e3d6b4;">
        <i class="fa-solid ${vehicleIcon}" style="color:#B08A3E;margin-top:2px;"></i>
        <div><b>קו ${escapeHtml(lineName)}</b> (${escapeHtml(vehicleHe)}) — עלייה ב"${escapeHtml(t.departure_stop.name)}", ירידה ב"${escapeHtml(t.arrival_stop.name)}" (${t.num_stops} תחנות, כ-${step.duration.text})${timesHTML}</div>
      </div>`;
    }
    if(isTransit && step.travel_mode === 'WALKING'){
      return `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #e3d6b4;">
        <i class="fa-solid fa-person-walking" style="color:#8A7454;margin-top:2px;"></i>
        <div>הליכה כ-${escapeHtml(step.duration.text)} (${escapeHtml(step.distance.text)})</div>
      </div>`;
    }
    // נסיעה ברכב: הוראה טקסטואלית של גוגל (מכיל תגי HTML פשוטים כמו הדגשת שם רחוב — מגיע ישירות מגוגל, בטוח להצגה)
    const instr = (step.instructions||'').toString();
    return `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #e3d6b4;">
      <i class="fa-solid fa-car" style="color:#8A7454;margin-top:2px;"></i>
      <div>${instr} <span class="small-note">(${escapeHtml(step.distance.text)})</span></div>
    </div>`;
  }).join('');
  return `<div style="font-size:13px;">${rows}</div>`;
}
function computeRouteForPlace(id){
  const p = DB.places.find(x=>x.id===id); if(!p) return;
  const resultEl = document.getElementById('routeResult');
  const msg = document.getElementById('routeMsg');
  const originInput = document.getElementById('routeOrigin');
  const origin = originInput ? originInput.value.trim() : '';
  if(!origin){ if(msg) msg.textContent = 'נא להזין נקודת יציאה, או ללחוץ על "המיקום שלי" קודם.'; return; }
  let dest = p.lat && p.lng ? {lat:p.lat, lng:p.lng} : null;
  if(!dest){
    dest = p.address ? (p.address + (p.city?(', '+p.city):'')) : (p.nameHe ? (p.nameHe+(p.city?(', '+p.city):'')) : null);
  }
  if(!dest){ if(msg) msg.textContent = 'לא נמצאה כתובת או מיקום למקום זה.'; return; }

  const timeMode = document.getElementById('routeTimeMode')?.value || 'now';
  const timeValueEl = document.getElementById('routeTimeValue');
  let chosenDate = null;
  if(timeMode !== 'now' && timeValueEl && timeValueEl.value){
    chosenDate = new Date(timeValueEl.value);
    if(isNaN(chosenDate.getTime())) chosenDate = null;
  }

  resultEl.innerHTML = '<p class="small-note"><i class="fa-solid fa-spinner fa-spin"></i> מחשב מסלול בתחבורה ציבורית...</p>';
  loadGoogleMapsScript().then(()=>{
    const svc = new google.maps.DirectionsService();
    const request = {
      origin: origin,
      destination: dest,
      travelMode: google.maps.TravelMode.TRANSIT,
    };
    if(chosenDate){
      if(timeMode === 'arrive') request.transitOptions = { arrivalTime: chosenDate };
      else if(timeMode === 'depart') request.transitOptions = { departureTime: chosenDate };
    }
    svc.route(request, (result, status)=>{
      if(status === 'OK' && result.routes && result.routes[0]){
        const leg = result.routes[0].legs[0];
        const durationText = leg.duration.text;
        let whenNote = '';
        if(timeMode === 'arrive' && chosenDate) whenNote = ` · כדי להגיע עד ${chosenDate.toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'})}`;
        else if(timeMode === 'depart' && chosenDate) whenNote = ` · ליציאה ב-${chosenDate.toLocaleString('he-IL',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'numeric'})}`;
        const stepsHTML = buildRouteStepsHTML(leg, true);
        const viewMapUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin)}&destination=${typeof dest==='object'?dest.lat+','+dest.lng:encodeURIComponent(dest)}&travelmode=transit`;
        resultEl.innerHTML = `<div style="background:#f7f1e3;border-radius:8px;padding:10px 12px;font-size:13.5px;">
          <div><i class="fa-solid fa-bus"></i> <b>${escapeHtml(leg.distance.text)}</b> · זמן נסיעה משוער: <b>${escapeHtml(durationText)}</b>${whenNote}</div>
          <div style="margin-top:10px;">${stepsHTML}</div>
          <a href="${viewMapUrl}" target="_blank" rel="noopener" class="btn btn-outline btn-sm" style="margin-top:10px;display:inline-flex;"><i class="fa-solid fa-map-location-dot"></i> צפייה במסלול על המפה</a>
        </div>`;
      } else if(status === 'ZERO_RESULTS'){
        resultEl.innerHTML = `<p class="small-note" style="color:#a33;">לא נמצא מסלול בתחבורה ציבורית בין הנקודות/בשעה שנבחרו. אפשר לנסות "ניווט לרכב פרטי בגוגל מפות" במקום.</p>`;
      } else {
        resultEl.innerHTML = `<p class="small-note" style="color:#a33;">לא הצלחנו לחשב מסלול (${escapeHtml(status||'')}). אפשר לנסות "ניווט לרכב פרטי בגוגל מפות" במקום.</p>`;
      }
    });
  }).catch(err=>{
    if(err && err.message === 'no-api-key'){
      resultEl.innerHTML = `<p class="small-note">חישוב מסלול בתוך העמוד דורש הגדרת מפתח Google Maps (ראו GOOGLE_MAPS_API_KEY בקוד האתר). בינתיים אפשר להשתמש ב"ניווט לרכב פרטי בגוגל מפות".</p>`;
    } else {
      resultEl.innerHTML = `<p class="small-note" style="color:#a33;">טעינת שירות המפות נכשלה. אפשר להשתמש ב"ניווט לרכב פרטי בגוגל מפות" במקום.</p>`;
    }
  });
}
function openRouteToPlace(id){
  const p = DB.places.find(x=>x.id===id); if(!p) return;
  const originInput = document.getElementById('routeOrigin');
  const origin = originInput ? originInput.value.trim() : '';
  const url = buildDrivingUrl(p, origin);
  if(!url){ alert('לא נמצאה כתובת או מיקום למקום זה, אי אפשר לבנות ניווט.'); return; }
  window.open(url, '_blank', 'noopener');
}

/* ========================= תגובות ציבור על מקומות (עם אישור מנהל לפני פרסום) ========================= */
function enforcePrWordLimit(){
  const el = document.getElementById('pr_text');
  const counter = document.getElementById('pr_counter');
  if(!el || !counter) return;
  const words = (el.value.trim().match(/\S+/g)||[]);
  if(words.length > 20){
    el.value = words.slice(0,20).join(' ');
  }
  const n = (el.value.trim().match(/\S+/g)||[]).length;
  counter.textContent = `${n}/20 מילים`;
  counter.style.color = n>=20 ? '#a33' : '';

/* תמונת מפה סטטית לצורך הדפסה/ייצוא — Google Static Maps (אמין ולרוב לא חסום ע"י מסנני תוכן), עם נפילה חזרה ל-OSM אם אין מפתח גוגל מוגדר */
function buildStaticMapUrl(lat, lng, width, height, zoom){
  zoom = zoom || 15;
  if(GOOGLE_MAPS_API_KEY && GOOGLE_MAPS_API_KEY !== 'YOUR_GOOGLE_MAPS_API_KEY_HERE'){
    return `https://maps.googleapis.com/maps/api/staticmap?center=${lat},${lng}&zoom=${zoom}&size=${width}x${height}&markers=color:red%7C${lat},${lng}&key=${GOOGLE_MAPS_API_KEY}`;
  }
  return `https://staticmap.openstreetmap.de/staticmap.php?center=${lat},${lng}&zoom=${zoom}&size=${width}x${height}&markers=${lat},${lng},red-pushpin`;
}
function doPrint(html, landscape){
  const area = document.getElementById('printArea');
  const original = area.innerHTML;
  area.innerHTML = html;
  let styleTag = null;
  if(landscape){
    styleTag = document.createElement('style');
    styleTag.id = 'tempPrintOrientation';
    styleTag.textContent = '@page{size:A4 landscape;margin:10mm;}';
    document.head.appendChild(styleTag);
  }
  // ממתינים שכל התמונות (כולל תמונת המפה) יסיימו להיטען לפני ההדפסה בפועל —
  // אחרת חלון ההדפסה עלול להיפתח לפני שהתמונה הגיעה, ולהיראות כדף ריק/חסר מפה.
  const imgs = Array.from(area.querySelectorAll('img'));
  const waitForImages = Promise.all(imgs.map(img=>{
    if(img.complete) return Promise.resolve();
    return new Promise(resolve=>{
      img.addEventListener('load', resolve, {once:true});
      img.addEventListener('error', resolve, {once:true});
      setTimeout(resolve, 4000); // רשת איטית/חסימה — לא תוקעים את ההדפסה יותר מדי, פשוט ממשיכים בלי לחכות לנצח
    });
  }));
  waitForImages.then(()=>{
    window.print();
    area.innerHTML = original;
    if(styleTag) styleTag.remove();
  });
}

function haversineKm(lat1,lng1,lat2,lng2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function onFilterChange(){

  document.getElementById('ratingVal').textContent = state.filters.minRating;

    requestUserLocationForSort();
    return;
  }

}
function requestUserLocationForSort(){
  const grid = document.getElementById('resultsGrid');
  if(grid) grid.innerHTML = '<p class="small-note" style="padding:30px;text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> מאתר את המיקום שלכם...</p>';
  if(!navigator.geolocation){
    alert('הדפדפן שלכם לא תומך באיתור מיקום. נבחר סוג מיון אחר.');
    state.filters.sort = 'manual';
    renderSearch();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      state.userLocation = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      renderResults();
    },
    ()=>{
      alert('לא הצלחנו לאתר את המיקום שלכם. נבחר סוג מיון אחר.');
      state.filters.sort = 'manual';
      renderSearch();
    },
    {timeout:8000}
  );
}
function clearFilters(){
  state.filters = {q:'',category:'',city:'',region:'',minRating:'',sort:'manual'};
  renderSearch();
}
function renderResults(){
  const f = state.filters;
  let list = DB.places.filter(p=>p.status==='published');
  if(f.q){
    const q = f.q.trim().toLowerCase();
    list = list.filter(p=> (p.nameHe+p.nameEn+p.city+p.region+p.description).toLowerCase().includes(q));
  }
  if(f.category) list = list.filter(p=>p.category===f.category);
  if(f.city) list = list.filter(p=>p.city===f.city);
  if(f.region) list = list.filter(p=>p.region===f.region);
  if(f.minRating) list = list.filter(p=>(p.rating||0) >= Number(f.minRating));

  if(f.sort==='name') list.sort((a,b)=>a.nameHe.localeCompare(b.nameHe,'he'));
  else if(f.sort==='rating') list.sort((a,b)=>(b.rating||0)-(a.rating||0));
  else if(f.sort==='updated') list.sort((a,b)=> new Date(b.updatedAt)-new Date(a.updatedAt));
  else if(f.sort==='distance' && state.userLocation){
    list.sort((a,b)=>{
      const da = (a.lat&&a.lng) ? haversineKm(state.userLocation.lat,state.userLocation.lng,a.lat,a.lng) : Infinity;
      const db = (b.lat&&b.lng) ? haversineKm(state.userLocation.lat,state.userLocation.lng,b.lat,b.lng) : Infinity;
      return da-db;
    });
  }
  else list.sort((a,b)=>(a.order||0)-(b.order||0));

    const d = (showDistance && p.lat && p.lng) ? haversineKm(state.userLocation.lat,state.userLocation.lng,p.lat,p.lng) : null;
    return placeCardHTML(p, d);
  }).join('') :

/* ========================= חיפוש חכם (מקומי, ללא שרת חיצוני) =========================
   רץ כולו בדפדפן: מפרק את התיאור החופשי למילות מפתח, ומדרג כל מקום מפורסם
   לפי כמות ההתאמות בין מילות המפתח לתוכן שלו (שם, עיר, אזור, תיאור ושדות נוספים). */
const HEBREW_STOPWORDS = new Set(['את','של','עם','על','אני','אנחנו','רוצה','רוצים','מחפש','מחפשים','משהו','מקום','ל','ב','מ','ו','ה','זה','זו','שיהיה','שתהיה','טוב','טובה','קצת','גם','או','לא','יש','בשביל','עבור','אחד','אחת']);
function tokenize(str){
  return (str||'').toString().toLowerCase()
    .replace(/[^\u0590-\u05FFa-z0-9\s]/g,' ')
    .split(/\s+/).filter(w=>w.length>1 && !HEBREW_STOPWORDS.has(w));
}
function scorePlaceAgainstQuery(place, keywords){
  const fields = [
    {text:place.nameHe, weight:3},
    {text:place.city, weight:3},
    {text:place.region, weight:2},
    {text:place.category, weight:2},
    {text:place.description, weight:1.5},
    {text:place.seating, weight:1},
    {text:place.foodDrink, weight:1},
    {text:place.nearbyTrips, weight:1},
    {text:place.notes, weight:0.5},
  ];
  let score = 0;
  keywords.forEach(kw=>{
    fields.forEach(f=>{
      if(f.text && f.text.toLowerCase().includes(kw)) score += f.weight;
    });
  });
  score += (place.rating||0) * 0.15; // בין שווים - עדיפות קלה למדורגים גבוה
  return score;
}
function runSmartSearch(){
  const query = document.getElementById('smartQuery').value.trim();
  const resultBox = document.getElementById('smartResult');
  if(!query){
    resultBox.className = 'smart-search-result show';
    resultBox.innerHTML = '<p class="note" style="color:#f3caca;">נא לתאר קודם את סוג הפגישה שאתם מחפשים.</p>';
    return;
  }
  const keywords = tokenize(query);
  trackEvent('search', {query, type:'smart'});
  const published = DB.places.filter(p=>p.status==='published');
  const scored = published.map(p=>({p, s:scorePlaceAgainstQuery(p, keywords)}))
    .filter(x=>x.s>0)
    .sort((a,b)=>b.s-a.s)
    .slice(0,5);

  resultBox.className = 'smart-search-result show';
  if(scored.length){
    const ids = scored.map(x=>x.p.id);
    resultBox.innerHTML = '<p class="note"><i class="fa-solid fa-lightbulb"></i> נמצאו מקומות שעשויים להתאים לתיאור שנתתם:</p>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">'+
      scored.map(x=>`<button class="btn btn-gold btn-sm" onclick="go('place',{activePlaceId:'${x.p.id}'})">${escapeHtml(x.p.nameHe)} <i class="fa-solid fa-arrow-left" style="font-size:10px;"></i></button>`).join('')+
      '</div>'+
      '<button class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="showSmartInResults('+JSON.stringify(ids)+')">הצגת התוצאות האלו למטה ברשימה</button>';
  } else {
    trackEvent('search_no_results', {query});
    resultBox.innerHTML = '<p class="note">לא נמצאה התאמה טובה במאגר לתיאור שסיפקתם. נסו לחפש באופן ידני באמצעות המסננים למטה, או נסחו את התיאור עם מילים אחרות (למשל שם עיר, קטגוריה או תיאור אווירה).</p>';
  }
}
function showSmartInResults(ids){
  const grid = document.getElementById('resultsGrid');
  const list = ids.map(id=>DB.places.find(p=>p.id===id && p.status==='published')).filter(Boolean);
  document.getElementById('resultCount').textContent = `${list.length} תוצאות מהחיפוש החכם`;
  grid.innerHTML = list.length ? list.map(p=>placeCardHTML(p)).join('') : '<div class="empty-state"><p>אין תוצאות להצגה.</p></div>';

}

function renderSimilarPlaces(p){

    let s = 0;
    if(x.category===p.category) s += 2;
    if(x.city===p.city) s += 3;
    if(x.region===p.region) s += 1;
    s += (x.rating||0) * 0.1;
    return {x, s};
  }).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).slice(0,4);
  if(!scored.length){ box.innerHTML = ''; return; }
  box.innerHTML = `<h3><i class="fa-solid fa-shuffle"></i> מקומות דומים שעשויים לעניין אתכם</h3>
    <div class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:10px;">
      ${scored.map(o=>placeCardHTML(o.x)).join('')}

}

async function submitContact(e){
  e.preventDefault();
  if(isHoneypotTriggered('c_hp')) return false;
  if(isFormOnCooldown('contact', 30)){
    document.getElementById('contactMsgArea').innerHTML = '<div class="form-error">כבר שלחתם פנייה לפני רגע. נא להמתין כחצי דקה לפני שליחה נוספת.</div>';
    return false;
  }
  const name=document.getElementById('c_name').value.trim();
  const contact=document.getElementById('c_contact').value.trim();
  const msg=document.getElementById('c_msg').value.trim();
  if(!name||!contact||!msg) return false;
  const item = {id:uid(), status:'חדש', data:{ name, contact, msg, createdAt:new Date().toISOString() }};
  const { error } = await sb.from('messages').insert(item);
  if(error){
    document.getElementById('contactMsgArea').innerHTML = `<div class="form-error">שליחת הפנייה נכשלה, נסו שוב מאוחר יותר.</div>`;
    return false;
  }
  setFormCooldown('contact');
  document.getElementById('contactMsgArea').innerHTML = `<div class="form-success"><i class="fa-solid fa-circle-check"></i> הפנייה נשלחה בהצלחה. נחזור אליכם בהקדם.</div>`;
  document.getElementById('contactForm').reset();
  return false;
}

async function personalAreaSignup(e){
  e.preventDefault();
  const email = document.getElementById('pa_email').value.trim();
  const pass = document.getElementById('pa_password').value;
  const msg = document.getElementById('personalAreaMsg');
  if(!email || pass.length < 6){
    msg.innerHTML = '<div class="form-error">נא להזין דוא"ל תקין וסיסמה בת 6 תווים לפחות.</div>';
    return false;
  }
  const { data, error } = await sb.auth.signUp({ email, password: pass, options:{ data:{ role:'user' } } });
  if(error){
    msg.innerHTML = `<div class="form-error">ההרשמה נכשלה: ${escapeHtml(error.message)}</div>`;
    return false;
  }
  if(data.session){ renderMyAccount(); }

async function loadAndRenderFavoritesList(){
  const box = document.getElementById('favoritesListBox');

    box.innerHTML = `<p style="color:#a33;">טעינת המועדפים נכשלה: ${escapeHtml(error.message)}<br><span class="small-note">ייתכן שטבלת favorites עדיין לא נוצרה — יש להריץ את קובץ ה-SQL הנלווה.</span></p>`;

async function toggleFavoritePlace(placeId){
  if(!state.userSession){
    if(confirm('כדי לשמור מקומות למועדפים יש להתחבר או להירשם לאזור האישי (חינם, לוקח דקה). לעבור לשם עכשיו?')) go('myaccount');
    return;
  }
  const userId = state.userSession.user.id;
  const { data } = await sb.from('favorites').select('place_id').eq('user_id', userId).eq('place_id', placeId).maybeSingle();
  if(data){ await sb.from('favorites').delete().eq('user_id', userId).eq('place_id', placeId); }
  else { await sb.from('favorites').insert({ user_id: userId, place_id: placeId }); }
  refreshFavoriteButton(placeId);
}
async function refreshFavoriteButton(placeId){

  btn.innerHTML = data ? '<i class="fa-solid fa-heart" style="color:#9A3B32;"></i> במועדפים' : '<i class="fa-regular fa-heart"></i> הוספה למועדפים';

function toggleCompareSelection(id){
  const idx = state.compareIds.indexOf(id);
  if(idx>=0){ state.compareIds.splice(idx,1); }
  else {
    if(state.compareIds.length>=3){ alert('ניתן להשוות עד 3 מקומות בו-זמנית. הסירו מקום מההשוואה כדי להוסיף מקום אחר.'); return; }
    state.compareIds.push(id);
  }
  renderCompareBar();
}
function renderCompareBar(){
  const bar = document.getElementById('compareBar');
  if(!bar) return;
  if(!state.compareIds.length || state.view==='compare'){ bar.innerHTML=''; bar.className='no-print'; return; }
  const chips = state.compareIds.map(id=>{
    const p = DB.places.find(x=>x.id===id);
    return `<span class="cb-chip">${escapeHtml(p?p.nameHe:'?')} <button onclick="toggleCompareSelection('${id}');event.stopPropagation();"><i class="fa-solid fa-xmark"></i></button></span>`;
  }).join('');
  bar.className = 'no-print compare-bar';
  bar.innerHTML = `${chips}
    <button class="btn btn-gold btn-sm" onclick="go('compare')"><i class="fa-solid fa-scale-balanced"></i> השוואה (${state.compareIds.length})</button>
    <button class="btn btn-outline btn-sm" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.4);" onclick="state.compareIds=[];renderCompareBar();">ניקוי</button>`;
}

  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('loginErr');
  errBox.innerHTML = '';
  btn.disabled = true; btn.textContent = 'מתחבר/ת...';
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){
    errBox.innerHTML = `<div class="form-error" style="text-align:center;margin-bottom:10px;">דוא"ל או סיסמה שגויים, נסו שוב.</div>`;
    btn.disabled = false; btn.textContent = 'כניסה';
    return false;
  }
  state.adminLoggedIn = true; state.adminTab = 'dashboard';
  renderAdmin();
  return false;
}
function adminLogout(){ sb.auth.signOut(); state.adminLoggedIn=false; go('home'); }
// שומר את מצב ההתחברות מסונכרן עם Supabase (למשל אחרי רענון דף)
// הערה: "האזור האישי" הציבורי (למועדפים) ופאנל הניהול חולקים את אותו מנגנון התחברות של Supabase.
// כדי שמשתמש ציבורי שנרשם לאזור האישי לא יזהה בטעות כמנהל, חשבונות שנרשמים דרך "האזור האישי"
// מסומנים עם role:'user' (ראו personalAreaSignup) — רק חשבון שאין לו סימון כזה (כלומר חשבון המנהל הקיים) נחשב מנהל.
let _adminNotifyChannel = null;
sb.auth.onAuthStateChange((event, session)=>{
  state.userSession = session || null;
  state.adminLoggedIn = !!session && (session.user.user_metadata?.role !== 'user');
  if(state.view==='admin') renderAdmin();
  if(state.view==='myaccount') renderMyAccount();
  if(state.adminLoggedIn) initAdminNotifications();
  else if(_adminNotifyChannel){ sb.removeChannel(_adminNotifyChannel); _adminNotifyChannel = null; }
  if(session && !state.adminLoggedIn) touchAppProfile(session.user);
});
/* מעדכן/יוצר רשומת "פרופיל" עבור משתמשי האזור האישי — כדי שהמנהל יוכל לראות כמה נרשמו ומתי נראו לאחרונה.
   דורש טבלה נוספת ב-Supabase (ראו app-profiles-setup.sql שנשלח בצ'אט). */
async function touchAppProfile(user){
  try{
    await sb.from('app_profiles').upsert({
      user_id: user.id, email: user.email, last_seen_at: new Date().toISOString()
    }, {onConflict:'user_id', ignoreDuplicates:false});
  }catch(e){ /* לא קריטי אם הטבלה עדיין לא קיימת */ }
}

/* ========================= התראות למנהל על פניות חדשות ========================= */
function initAdminNotifications(){
  if(_adminNotifyChannel) return; // כבר פעיל
  // שימו לב: בקשת הרשאה להתראות (Notification.requestPermission) חייבת להתבצע כתגובה ישירה ללחיצת המשתמש
  // (כפתור "הפעלת התראות דפדפן" בהגדרות) — קריאה אוטומטית כאן נחסמת בשקט על ידי רוב הדפדפנים.
  _adminNotifyChannel = sb.channel('admin-new-messages')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, payload=>{
      const d = (payload.new && payload.new.data) || {};
      showAdminNotification('פנייה חדשה התקבלה', `${d.name||'אורח'}: ${(d.msg||'').slice(0,80)}`);
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'suggestions'}, payload=>{
      const d = (payload.new && payload.new.data) || {};
      const isEdit = d.type==='edit';
      showAdminNotification(isEdit?'בקשת עריכה חדשה':'הצעת מקום חדשה', `${d.name||''}`, 'suggestions');
    })
    .subscribe();
}
function showAdminNotification(title, body, tab){
  tab = tab || 'messages';
  // התראת דפדפן (אם הורשתה)
  if('Notification' in window && Notification.permission === 'granted'){
    try{
      const n = new Notification(title, { body, icon: LOGO_SRC });
      n.onclick = ()=>{ window.focus(); go('admin', {adminTab:tab}); n.close(); };
    }catch(e){ /* מתעלמים אם הדפדפן חוסם */ }
  }
  // הודעה קופצת בתוך האתר (עובדת תמיד, גם ללא הרשאת דפדפן)
  showInAppToast(title, body, tab);
}
function showInAppToast(title, body, tab){
  tab = tab || 'messages';
  const toast = document.createElement('div');
  toast.className = 'admin-toast no-print';
  toast.innerHTML = `<div style="font-weight:800;font-size:13.5px;margin-bottom:2px;"><i class="fa-solid fa-bell"></i> ${escapeHtml(title)}</div><div style="font-size:12.5px;color:var(--muted);">${escapeHtml(body)}</div>`;
  toast.onclick = ()=>{ go('admin', {adminTab:tab}); toast.remove(); };
  document.body.appendChild(toast);
  setTimeout(()=>{ toast.style.opacity='0'; toast.style.transform='translateY(-10px)'; setTimeout(()=>toast.remove(), 400); }, 7000);
}
function setAdminTab(k){ state.adminTab=k; renderAdminTab(); }

async function renderAdminTab(){
  const c = document.getElementById('adminContent');
  if(state.adminTab==='dashboard'){
    c.innerHTML = '<p style="padding:20px;color:var(--muted);">טוען נתונים...</p>';
    const [{count:newMsgs}, {count:pendingSug}] = await Promise.all([
      sb.from('messages').select('*', {count:'exact', head:true}).eq('status','חדש'),
      sb.from('suggestions').select('*', {count:'exact', head:true}).eq('status','ממתין לבדיקה')
    ]);
    return renderAdminDashboard(c, newMsgs||0, pendingSug||0);
  }
  if(state.adminTab==='places') return renderAdminPlaces(c);
  if(state.adminTab==='messages'){
    c.innerHTML = '<p style="padding:20px;color:var(--muted);">טוען פניות...</p>';
    await loadMessagesForAdmin();
    return renderAdminMessages(c);
  }
  if(state.adminTab==='suggestions'){
    c.innerHTML = '<p style="padding:20px;color:var(--muted);">טוען הצעות...</p>';
    await loadSuggestionsForAdmin();
    return renderAdminSuggestions(c);
  }
  if(state.adminTab==='ads') return renderAdminAds(c);
  if(state.adminTab==='groom') return renderAdminGroomBenefits(c);
  if(state.adminTab==='about') return renderAdminAbout(c);
  if(state.adminTab==='analytics'){
    c.innerHTML = '<p style="padding:20px;color:var(--muted);">טוען נתוני שימוש...</p>';
    await loadAndRenderAnalytics(c);
    return;
  }
  if(state.adminTab==='advisor') return renderAdminAdvisor(c);
  if(state.adminTab==='users'){
    c.innerHTML = '<p style="padding:20px;color:var(--muted);">טוען רשימת משתמשים...</p>';
    return renderAdminUsers(c);
  }
  if(state.adminTab==='auditlog'){
    c.innerHTML = '<p style="padding:20px;color:var(--muted);">טוען יומן פעילות...</p>';
    return renderAdminAuditLog(c);
  }
  if(state.adminTab==='settings') return renderAdminSettings(c);
}

    <div class="stat-card"><div class="num">${DB.settings.ad.enabled?'פעילה':'כבויה'}</div><div class="lbl">פרסומת צפה</div></div>
    <div class="stat-card"><div class="num"><i class="fa-solid fa-check" style="color:#4caf50;"></i></div><div class="lbl">התקנה כאפליקציה פעילה</div></div>

function renderAdminPlaces(c){
  c.innerHTML = `
  <div class="toolbar">

    <button class="btn btn-gold btn-sm" onclick="bulkSetStatus('published')">פרסום הנבחרים</button>
    <button class="btn btn-outline btn-sm" onclick="bulkSetStatus('hidden')">הסתרת הנבחרים</button>
    <button class="btn btn-outline btn-sm" onclick="bulkSetStatus('archive')">העברה לארכיון</button>

    <tbody id="adminPlacesBody"></tbody>
  </table></div>`;
  document.getElementById('adminPlaceSearch').addEventListener('input', drawAdminPlacesTable);

}
let _bulkSelectedPlaceIds = new Set();
function toggleSelectAllPlaces(checked){
  document.querySelectorAll('.bulk-place-check').forEach(cb=>{
    cb.checked = checked;
    if(checked) _bulkSelectedPlaceIds.add(cb.dataset.id); else _bulkSelectedPlaceIds.delete(cb.dataset.id);
  });
  updateBulkBar();
}
function togglePlaceSelected(id, checked){
  if(checked) _bulkSelectedPlaceIds.add(id); else _bulkSelectedPlaceIds.delete(id);
  updateBulkBar();
}
function updateBulkBar(){
  const bar = document.getElementById('bulkActionsBar');
  const countEl = document.getElementById('bulkSelectedCount');
  if(!bar) return;
  if(_bulkSelectedPlaceIds.size){
    bar.style.display = 'flex';
    countEl.textContent = `${_bulkSelectedPlaceIds.size} מקומות נבחרו`;
  } else {
    bar.style.display = 'none';
  }
}
async function bulkSetStatus(status){
  if(!_bulkSelectedPlaceIds.size) return;
  const ids = [..._bulkSelectedPlaceIds];
  for(const id of ids){
    const p = DB.places.find(x=>x.id===id); if(!p) continue;
    p.status = status; p.updatedAt = new Date().toISOString().slice(0,10);
    await upsertPlaceRow(p);
  }
  _bulkSelectedPlaceIds.clear();
  drawAdminPlacesTable();
}
async function bulkDeletePlaces(){
  if(!_bulkSelectedPlaceIds.size) return;
  if(!confirm(`למחוק ${_bulkSelectedPlaceIds.size} מקומות לצמיתות? פעולה זו אינה הפיכה.`)) return;
  const ids = [..._bulkSelectedPlaceIds];
  for(const id of ids){ await deletePlaceRow(id); }
  DB.places = DB.places.filter(p=>!_bulkSelectedPlaceIds.has(p.id));
  _bulkSelectedPlaceIds.clear();
  drawAdminPlacesTable();
}
async function duplicatePlace(id){
  const src = DB.places.find(x=>x.id===id); if(!src) return;
  const copy = {...src, id:uid(), nameHe:(src.nameHe||'')+' (עותק)', status:'draft',
    order:(DB.places.length+1), updatedAt:new Date().toISOString().slice(0,10)};
  DB.places.push(copy);
  const ok = await upsertPlaceRow(copy, true);
  if(!ok) return;
  drawAdminPlacesTable();
}
function drawAdminPlacesTable(){
  const bodyEl = document.getElementById('adminPlacesBody');
  if(!bodyEl) return; // המנהל לא נמצא כרגע בלשונית "מקומות" — אין צורך לרענן את הטבלה
  const q = (document.getElementById('adminPlaceSearch')?.value||'').toLowerCase();
  let list = [...DB.places].sort((a,b)=>(a.order||0)-(b.order||0));
  if(q) list = list.filter(p=>(p.nameHe+p.city).toLowerCase().includes(q));
  const statusLabel = {published:'מפורסם',draft:'טיוטה',hidden:'מוסתר',archive:'ארכיון'};
  bodyEl.innerHTML = list.map(p=>`
    <tr>
      <td><input type="checkbox" class="bulk-place-check" data-id="${p.id}" ${_bulkSelectedPlaceIds.has(p.id)?'checked':''} onchange="togglePlaceSelected('${p.id}', this.checked)"></td>
      <td><input type="number" value="${p.order||0}" style="width:52px;padding:4px;border:1px solid var(--line);border-radius:6px;" onchange="updateOrder('${p.id}', this.value)"></td>
      <td>${escapeHtml(p.nameHe)}</td>
      <td>${escapeHtml(p.category)}</td>
      <td>${escapeHtml(p.city)}</td>
      <td><span class="status-badge status-${p.status}">${statusLabel[p.status]||p.status}</span></td>
      <td>${p.rating||'—'}/10</td>
      <td>${escapeHtml(p.updatedAt||'')}</td>
      <td class="admin-actions">
        <button class="btn btn-outline btn-sm" onclick="openPlaceModal('${p.id}')"><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-outline btn-sm" onclick="duplicatePlace('${p.id}')" title="שכפול מקום"><i class="fa-solid fa-copy"></i></button>
        ${p.status!=='published'?`<button class="btn btn-gold btn-sm" onclick="setPlaceStatus('${p.id}','published')">פרסום</button>`:`<button class="btn btn-outline btn-sm" onclick="setPlaceStatus('${p.id}','hidden')">הסתרה</button>`}
        <button class="btn btn-outline btn-sm" onclick="setPlaceStatus('${p.id}','archive')"><i class="fa-solid fa-box-archive"></i></button>
        <button class="btn btn-danger btn-sm" onclick="deletePlace('${p.id}')"><i class="fa-solid fa-trash"></i></button>
      </td>
    </tr>`).join('') || `<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:24px;">אין מקומות תואמים.</td></tr>`;
  updateBulkBar();
}
async function updateOrder(id,val){
  const p = DB.places.find(x=>x.id===id); if(!p) return;
  p.order = Number(val)||0; await upsertPlaceRow(p); drawAdminPlacesTable();
}
async function setPlaceStatus(id,status){
  const p = DB.places.find(x=>x.id===id); if(!p) return;
  p.status = status; p.updatedAt = new Date().toISOString().slice(0,10);
  await upsertPlaceRow(p); drawAdminPlacesTable();
}
async function deletePlace(id){
  if(!confirm('למחוק את המקום? פעולה זו אינה הפיכה.')) return;
  const ok = await deletePlaceRow(id);
  if(!ok) return;
  DB.places = DB.places.filter(p=>p.id!==id);
  drawAdminPlacesTable();
}

/* מעלה קובץ תמונה ל-Supabase Storage (bucket: place-images) ומחזיר כתובת URL ציבורית קלה, במקום להטמיע כטקסט ענק בתוך הנתונים */
function compressImageFile(file, maxW=1200, quality=0.82){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob=>resolve(blob), 'image/jpeg', quality);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadImageToStorage(file){
  const blob = await compressImageFile(file);
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const { error } = await sb.storage.from('place-images').upload(path, blob, { contentType:'image/jpeg' });
  if(error){ throw error; }
  const { data } = sb.storage.from('place-images').getPublicUrl(path);
  return data.publicUrl;
}
function handlePlaceImagesUpload(event){
  const files = Array.from(event.target.files || []);
  if(!files.length) return;
  const ta = document.getElementById('m_images');

  files.forEach(async file=>{
    if(file.size > 10*1024*1024){ statusEl.innerHTML = '<span style="color:#a33;">קובץ גדול מדי, דילוג.</span>'; return; }
    statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> מעלה תמונה...';
    try{

      ta.value = (ta.value.trim() ? ta.value.trim()+'\n' : '') + url;
      refreshImagesPreview();
      statusEl.innerHTML = '<span style="color:#2e7d32;">התמונה הועלתה בהצלחה.</span>';
    }catch(err){

  });

}
/* ========================= חיפוש אוטומטי דרך Google Places (למנהל בלבד, בטופס הוספת/עריכת מקום) =========================
   מטרה: להקליד שם עסק ולקבל אוטומטית שם באנגלית, כתובת מלאה, מיקום על מפה, ותמונות אמיתיות. */
let gplacesSessionToken = null;
let gplacesDebounceTimer = null;
async function handleGPlacesInput(){
  const input = document.getElementById('gplaces_search').value.trim();
  const box = document.getElementById('gplaces_suggestions');
  const status = document.getElementById('gplaces_status');
  clearTimeout(gplacesDebounceTimer);
  if(input.length < 3){ box.innerHTML=''; return; }
  gplacesDebounceTimer = setTimeout(async ()=>{
    try{
      status.innerHTML = '<span class="small-note"><i class="fa-solid fa-spinner fa-spin"></i> מחפש...</span>';
      const { AutocompleteSessionToken, AutocompleteSuggestion } = await google.maps.importLibrary("places");
      if(!gplacesSessionToken) gplacesSessionToken = new AutocompleteSessionToken();
      const request = { input, sessionToken: gplacesSessionToken, includedRegionCodes: ['il'], language: 'iw' };
      const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions(request);
      status.innerHTML = '';
      if(!suggestions || !suggestions.length){
        box.innerHTML = '<div class="small-note" style="padding:6px;">לא נמצאו תוצאות.</div>';
        return;
      }
      box.innerHTML = `<div style="position:absolute;z-index:50;background:#fff;border:1px solid #ddd;border-radius:8px;width:100%;max-height:220px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.12);">
        ${suggestions.map((s,i)=>{
          const pred = s.placePrediction;
          return `<div class="gplaces-item" style="padding:10px;cursor:pointer;border-bottom:1px solid #f0f0f0;" onclick="selectGPlace(${i})">${escapeHtml(pred.text.text)}</div>`;
        }).join('')}
      </div>`;
      window._gplacesSuggestions = suggestions;
    }catch(err){
      console.error('gplaces autocomplete error', err);
      status.innerHTML = '<span style="color:#a33;">החיפוש נכשל. ודאו חיבור לאינטרנט ותקינות מפתח ה-API.</span>';
    }
  }, 350);
}
async function selectGPlace(idx){
  const status = document.getElementById('gplaces_status');
  document.getElementById('gplaces_suggestions').innerHTML = '';
  status.innerHTML = '<span class="small-note"><i class="fa-solid fa-spinner fa-spin"></i> טוען פרטי מקום ומתרגם שם...</span>';
  try{
    const suggestion = window._gplacesSuggestions[idx];
    const basePlace = suggestion.placePrediction.toPlace();
    const placeId = basePlace.id;
    const { Place } = await google.maps.importLibrary("places");
    const placeHe = new Place({ id: placeId, requestedLanguage: 'iw' });
    const placeEn = new Place({ id: placeId, requestedLanguage: 'en' });
    await Promise.all([
      placeHe.fetchFields({ fields: ['displayName','formattedAddress','addressComponents','location','photos'] }),
      placeEn.fetchFields({ fields: ['displayName'] })
    ]);

    if(placeHe.displayName) document.getElementById('m_nameHe').value = placeHe.displayName;
    if(placeEn.displayName) document.getElementById('m_nameEn').value = placeEn.displayName;
    if(placeHe.formattedAddress) document.getElementById('m_address').value = placeHe.formattedAddress;
    if(placeHe.location){
      document.getElementById('m_lat').value = placeHe.location.lat().toFixed(6);
      document.getElementById('m_lng').value = placeHe.location.lng().toFixed(6);
      const d=0.006, lat=placeHe.location.lat(), lng=placeHe.location.lng();
      const bbox = `${lng-d},${lat-d},${lng+d},${lat+d}`;
      document.getElementById('mapPreviewBox').innerHTML = `<iframe class="map-frame" style="width:100%;height:220px;border:0;border-radius:8px;" loading="lazy" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&marker=${lat},${lng}&layer=mapnik"></iframe>`;
    }
    // עיר: לוקחים מתוך רכיבי הכתובת (locality)
    const cityComp = (placeHe.addressComponents||[]).find(c=>c.types.includes('locality'));
    if(cityComp){
      document.getElementById('m_city').value = cityComp.longText;
    }
    // תמונות: מוסיפים עד 3 תמונות אמיתיות מגוגל (קישור ישיר לתמונה המתארחת אצל גוגל, קליל ומהיר)
    if(placeHe.photos && placeHe.photos.length){
      const ta = document.getElementById('m_images');
      const existing = ta.value.trim();
      const newUrls = placeHe.photos.slice(0,2).map(ph => ph.getURI({maxWidth:1200}));
      ta.value = (existing ? existing+'\n' : '') + newUrls.join('\n');
      refreshImagesPreview();
    }
    status.innerHTML = '<span style="color:#2e7d32;"><i class="fa-solid fa-circle-check"></i> הפרטים נטענו ותורגמו בהצלחה. אפשר לערוך כל שדה לפני השמירה.</span>';
    document.getElementById('gplaces_search').value = '';
  }catch(err){
    console.error('gplaces details error', err);
    status.innerHTML = '<span style="color:#a33;">טעינת הפרטים נכשלה. נסו שוב, או מלאו את השדות ידנית.</span>';
  }
}
