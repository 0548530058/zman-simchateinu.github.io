async function savePlaceModal(id, publish){
  const nameHe = document.getElementById('m_nameHe').value.trim();
  const city = document.getElementById('m_city').value.trim();
  if(!nameHe || !city){
    document.getElementById('modalErr').innerHTML = `<div class="form-error">יש למלא שם מקום ועיר לפני שמירה.</div>`;
    return;
  }
  if(!id){
    const dup = DB.places.find(p=>p.nameHe.trim().toLowerCase()===nameHe.toLowerCase() && p.city.trim().toLowerCase()===city.toLowerCase());
    if(dup){
      const statusLabel = {published:'מפורסם',draft:'טיוטה',hidden:'מוסתר',archive:'ארכיון'};
      const ok = confirm(`כבר קיים מקום בשם "${dup.nameHe}" בעיר "${dup.city}" (סטטוס: ${statusLabel[dup.status]||dup.status}). להוסיף בכל זאת מקום חדש נוסף?`);
      if(!ok) return;
    }
  }
  const data = {
    nameHe, nameEn:document.getElementById('m_nameEn').value.trim(),
    formerName:document.getElementById('m_formerName').value.trim(),
    category:document.getElementById('m_category').value, city,
    region:document.getElementById('m_region').value,
    address:document.getElementById('m_address').value.trim(),
    lat:parseFloat(document.getElementById('m_lat').value)||null,
    lng:parseFloat(document.getElementById('m_lng').value)||null,
    rating:Number(document.getElementById('m_rating').value)||0,
    ratingLabel:document.getElementById('m_ratingLabel').value.trim(),
    status: publish?'published':document.getElementById('m_status').value,
    order:Number(document.getElementById('m_order').value)||0,
    images:document.getElementById('m_images').value.split('\n').map(s=>s.trim()).filter(Boolean),
    description:getRichEditorHTML('m_description'),
    directions:getRichEditorHTML('m_directions'),
    seating:getRichEditorHTML('m_seating'),
    foodDrink:getRichEditorHTML('m_foodDrink'),
    services:getRichEditorHTML('m_services'),
    payment:getRichEditorHTML('m_payment'),
    nearbyTrips:getRichEditorHTML('m_nearbyTrips'),
    notes:getRichEditorHTML('m_notes'),
    updatedAt:new Date().toISOString().slice(0,10)
  };
  let savedPlace;
  if(id){
    const idx = DB.places.findIndex(p=>p.id===id);
    DB.places[idx] = {...DB.places[idx], ...data};
    savedPlace = DB.places[idx];
  } else {
    savedPlace = {id:uid(), ...data};
    DB.places.push(savedPlace);
  }
  const ok = await upsertPlaceRow(savedPlace, !id);
  if(!ok) return;
  if(window._convertingSuggestionId){
    await markSuggestionHandled(window._convertingSuggestionId);
    window._convertingSuggestionId = null;
  }
  if(window._editSourceSuggestionId){
    await markSuggestionHandled(window._editSourceSuggestionId);
    window._editSourceSuggestionId = null;
  }
  document.getElementById('placeModal').remove();
  drawAdminPlacesTable();
  if(state.adminTab==='suggestions') renderAdminTab();
}

/* בונה קישור מענה חכם: וואטסאפ אם זה מספר טלפון, מייל אם זו כתובת דוא"ל */
function buildReplyLink(m){
  const contact = (m.contact||'').trim();
  const greeting = `שלום ${m.name||''},\n\n`;
  if(!contact) return null;
  if(contact.includes('@')){
    const subject = encodeURIComponent('מענה לפנייתך במאגר זמן שמחתנו');
    const body = encodeURIComponent(greeting);
    // Gmail web compose — עובד ישירות בדפדפן, בלי תלות בתוכנת מייל מותקנת במחשב
    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(contact)}&su=${subject}&body=${body}`;
    return { url:gmailUrl, icon:'fa-envelope', label:'מענה במייל (Gmail)', isMailto:false };
  }
  const digits = contact.replace(/[^\d+]/g,'');
  if(digits.replace(/\+/g,'').length >= 8){
    let intl = digits.replace(/^0/, '972').replace('+','');
    const text = encodeURIComponent(greeting);
    return { url:`https://wa.me/${intl}?text=${text}`, icon:'fa-brands fa-whatsapp', label:'מענה בוואטסאפ', isMailto:false };
  }
  return null;
}

async function markAllMessagesDone(){

/* ========================= ייעוץ חכם למאגר =========================
   ניתוח מבוסס-נתונים (לא בינה מלאכותית אמיתית, אלא כללי אצבע סטטיסטיים — באותה רוח כמו "החיפוש החכם" באתר):
   בודק שלמות מידע לכל מקום, משווה דירוגים למקומות דומים במאגר, ומאתר פערי כיסוי (ערים/אזורים עם מעט אפשרויות). */
const ADVISOR_FIELD_WEIGHTS = [
  ['description',24,'תיאור המקום'], ['directions',14,'דרכי הגעה'], ['address',8,'כתובת'],
  ['seating',10,'מקומות ישיבה'], ['foodDrink',8,'שתייה ואוכל'], ['services',8,'שירותים'],
  ['payment',8,'תשלום'], ['nearbyTrips',6,'מקומות טיול בסביבה'], ['notes',4,'הערות והמלצות'],
];
function computeCompleteness(p){
  let score=0, total=0; const missing=[];
  ADVISOR_FIELD_WEIGHTS.forEach(([f,w,label])=>{
    total+=w;
    if(p[f] && stripHtmlTags(p[f]).length>5) score+=w; else missing.push(label);
  });
  total+=12;
  const imgCount = (p.images||[]).filter(Boolean).length;
  if(imgCount>=2) score+=12; else if(imgCount===1){ score+=6; missing.push('תמונה נוספת (יש רק תמונה אחת)'); } else missing.push('תמונות');
  total+=8;
  if(p.lat && p.lng) score+=8; else missing.push('מיקום מדויק על המפה');
  return {pct: Math.round((score/total)*100), missing};
}
function suggestRatingFor(p, completeness){
  const peers = DB.places.filter(x=>x.category===p.category && x.id!==p.id && x.rating);
  const catAvg = peers.length ? peers.reduce((s,x)=>s+Number(x.rating||0),0)/peers.length : 7;
  let base = catAvg + (completeness.pct-70)/25;
  const imgCount = (p.images||[]).filter(Boolean).length;
  if(imgCount===0) base -= 1;
  if(p.lat && p.lng) base += 0.2;
  base = Math.min(10, Math.max(1, base));
  return Math.round(base*2)/2;
}
function renderAdminAdvisor(c){
  c.innerHTML = `
  <div class="form-card" style="margin:0;max-width:100%;">
    <h2 style="text-align:right;"><i class="fa-solid fa-lightbulb"></i> ייעוץ חכם למאגר</h2>
    <p class="form-lead" style="text-align:right;margin-bottom:14px;">כלי עזר שעובר על כל המקומות במאגר ומציע מה כדאי להשלים או לשפר, כולל <b>הצעת דירוג</b> לכל מקום המבוססת על שלמות המידע שלו בהשוואה למקומות דומים באותה קטגוריה. ההצעות הן כלל-אצבע מבוסס נתונים בלבד (לא בינה מלאכותית) — מומלץ להפעיל שיקול דעת אנושי לפני שינוי בפועל.</p>

  </div>`;

function runAdvisorAnalysis(){
  const box = document.getElementById('advisorResults');
  box.innerHTML = '<p class="small-note"><i class="fa-solid fa-spinner fa-spin"></i> מנתח את המאגר...</p>';

  const places = DB.places;
  const analyzed = places.map(p=>{
    const completeness = computeCompleteness(p);
    const suggestedRating = suggestRatingFor(p, completeness);
    return {p, completeness, suggestedRating};
  }).sort((a,b)=>a.completeness.pct - b.completeness.pct);

  // ניתוח פערי כיסוי: ערים/אזורים עם מעט מאוד מקומות מפורסמים
  const published = places.filter(p=>p.status==='published');
  const cityCounts = {};
  published.forEach(p=>{ const c=p.city||'(ללא עיר)'; cityCounts[c]=(cityCounts[c]||0)+1; });
  const thinCities = Object.entries(cityCounts).filter(([,n])=>n<=1).sort((a,b)=>a[1]-b[1]);
  const catCounts = {};
  published.forEach(p=>{ catCounts[p.category]=(catCounts[p.category]||0)+1; });
  const thinCats = CATEGORIES.filter(c=>!catCounts[c] || catCounts[c]<=1);

  const draftTooLong = places.filter(p=>p.status==='draft').length;
  const avgCompleteness = analyzed.length ? Math.round(analyzed.reduce((s,x)=>s+x.completeness.pct,0)/analyzed.length) : 0;
  const needsWork = analyzed.filter(x=>x.completeness.pct<70);
  const ratingMismatch = analyzed.filter(x=>x.p.rating && Math.abs(Number(x.p.rating)-x.suggestedRating)>=1.5);

  // מקומות מפורסמים שלא עודכנו זמן רב — פרטים כמו מחיר או שעות פעילות עלולים להיות לא מעודכנים
  const STALE_DAYS = 180;
  const now = Date.now();
  const staleThreshold = now - STALE_DAYS*24*60*60*1000;
  const stalePlaces = published.filter(p=>{
    if(!p.updatedAt) return true;
    const t = new Date(p.updatedAt).getTime();
    return isNaN(t) || t < staleThreshold;
  }).sort((a,b)=> new Date(a.updatedAt||0) - new Date(b.updatedAt||0));

  box.innerHTML = `
    <div class="stat-grid" style="margin-bottom:20px;">
      <div class="stat-card"><div class="num">${avgCompleteness}%</div><div class="lbl">שלמות מידע ממוצעת</div></div>
      <div class="stat-card"><div class="num">${needsWork.length}</div><div class="lbl">מקומות כדאי להשלים מידע עבורם</div></div>
      <div class="stat-card"><div class="num">${ratingMismatch.length}</div><div class="lbl">דירוגים שכדאי לבדוק מחדש</div></div>
      <div class="stat-card"><div class="num">${stalePlaces.length}</div><div class="lbl">לא עודכנו מעל חצי שנה</div></div>
    </div>

    ${(thinCities.length || thinCats.length) ? `
    <div class="form-card" style="margin:0 0 20px;">
      <h3 style="text-align:right;margin:0 0 8px;font-size:15px;">פערי כיסוי במאגר</h3>
      ${thinCities.length ? `<p style="font-size:13px;margin:4px 0;"><b>ערים עם מקום אחד בלבד (או פחות):</b> ${thinCities.slice(0,12).map(([c,n])=>escapeHtml(c)+' ('+n+')').join(', ')}. כדאי לשקול הוספת עוד אפשרות או שתיים בערים האלו, כדי לתת בחירה אמיתית לגולשים.</p>` : ''}
      ${thinCats.length ? `<p style="font-size:13px;margin:4px 0;"><b>קטגוריות עם מעט מקומות מפורסמים:</b> ${thinCats.map(escapeHtml).join(', ')}.</p>` : ''}
    </div>` : ''}

    ${stalePlaces.length ? `
    <div class="form-card" style="margin:0 0 20px;">
      <h3 style="text-align:right;margin:0 0 8px;font-size:15px;"><i class="fa-solid fa-clock-rotate-left"></i> מקומות שכדאי לבדוק שוב (לא עודכנו מעל חצי שנה)</h3>
      <p class="form-lead" style="text-align:right;margin-bottom:10px;">מחירים, שעות פעילות וזמינות עשויים להשתנות — כדאי לוודא שהפרטים עדיין נכונים.</p>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${stalePlaces.map(p=>`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1e7ce;padding:6px 0;flex-wrap:wrap;gap:8px;">
          <span>${escapeHtml(p.nameHe)} <span class="small-note">· ${escapeHtml(p.city)}</span></span>
          <span class="small-note">עודכן לאחרונה: ${p.updatedAt?new Date(p.updatedAt).toLocaleDateString('he-IL'):'לא ידוע'}</span>
          <button class="btn btn-outline btn-sm" onclick="openPlaceModal('${p.id}')">בדיקה ועדכון</button>
        </div>`).join('')}
      </div>
    </div>` : ''}

    <h3 style="text-align:right;margin:0 0 10px;font-size:15px;">מקומות לפי עדיפות טיפול (הכי חסרים קודם)</h3>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${analyzed.map(x=>renderAdvisorPlaceCard(x)).join('')}
    </div>
  `;
}
function renderAdvisorPlaceCard(x){
  const {p, completeness, suggestedRating} = x;
  const barColor = completeness.pct>=80 ? '#3E6B3A' : completeness.pct>=50 ? '#B08A3E' : '#9A3B32';
  const currentRating = p.rating || null;
  const showRatingNote = currentRating && Math.abs(Number(currentRating)-suggestedRating) >= 1.5;
  return `<div style="border:1px solid #eee0c4;border-radius:10px;padding:14px;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
      <div style="font-weight:700;">${escapeHtml(p.nameHe||'(ללא שם)')} <span class="small-note">· ${escapeHtml(p.city||'')} · ${escapeHtml(p.category||'')}</span></div>
      <button class="btn btn-outline btn-sm" onclick="openPlaceModal('${p.id}')">פתיחה לעריכה</button>
    </div>
    <div style="background:#f1e7ce;border-radius:6px;height:8px;overflow:hidden;margin-bottom:6px;">
      <div style="width:${completeness.pct}%;height:100%;background:${barColor};"></div>
    </div>
    <div class="small-note" style="margin-bottom:8px;">שלמות מידע: ${completeness.pct}%${completeness.missing.length?' · חסר: '+completeness.missing.map(escapeHtml).join(', '):' · המידע מלא!'}</div>
    <div style="display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap;">
      <span><i class="fa-solid fa-star" style="color:#B08A3E;"></i> דירוג נוכחי: <b>${currentRating||'—'}</b>/10</span>
      <span style="color:#8A7454;">→</span>
      <span>דירוג מוצע: <b>${suggestedRating}</b>/10</span>
      ${showRatingNote?'<span class="small-note" style="color:#9A3B32;">(פער משמעותי מהדירוג הנוכחי — כדאי לבדוק)</span>':''}
      ${Number(currentRating)!==suggestedRating ? `<button class="btn btn-gold btn-sm" onclick="applyAdvisorRating('${p.id}', ${suggestedRating}, this)">קבלת הדירוג המוצע</button>` : ''}
    </div>
  </div>`;
}
async function applyAdvisorRating(placeId, newRating, btnEl){
  const p = DB.places.find(x=>x.id===placeId); if(!p) return;
  p.rating = newRating;
  p.updatedAt = new Date().toISOString().slice(0,10);
  const ok = await upsertPlaceRow(p);

    btnEl.outerHTML = '<span class="small-note" style="color:#3E6B3A;"><i class="fa-solid fa-circle-check"></i> הדירוג עודכן</span>';
  }
}

  if(ad.type==='video') return `<video src="${escapeHtml(ad.imageUrl)}" controls style="max-width:280px;max-height:180px;border-radius:8px;display:block;"></video>`;

/* העלאת קובץ גולמי (וידאו/PDF) ל-Storage, ללא דחיסה (רק תמונות עוברות דחיסה) */
async function uploadRawFileToStorage(file, ext){
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const { error } = await sb.storage.from('place-images').upload(path, file, { contentType: file.type });
  if(error) throw error;
  const { data } = sb.storage.from('place-images').getPublicUrl(path);
  return data.publicUrl;
}
async function handleAdImageUpload(event){
  const file = event.target.files[0];
  if(!file) return;
  const type = document.getElementById('ad_type').value;
  const maxSize = type==='video' ? 25*1024*1024 : 15*1024*1024;
  if(file.size > maxSize){ alert(`הקובץ גדול מדי (מקסימום ${Math.round(maxSize/1024/1024)}MB).`); return; }
  document.getElementById('ad_img_preview').innerHTML = '<span class="small-note"><i class="fa-solid fa-spinner fa-spin"></i> מעלה קובץ...</span>';
  try{
    let url;
    if(type==='video') url = await uploadRawFileToStorage(file, 'mp4');
    else if(type==='pdf') url = await uploadRawFileToStorage(file, 'pdf');
    else url = await uploadImageToStorage(file);
    document.getElementById('ad_img').value = url;
    document.getElementById('ad_img_preview').innerHTML = renderAdPreviewHtml({type, imageUrl:url});
  }catch(err){
    console.error('ad file upload failed', err);
    document.getElementById('ad_img_preview').innerHTML = '<span style="color:#a33;">העלאת הקובץ נכשלה: '+escapeHtml(err.message||'')+'</span>';
  }
}
async function saveAdSettings(){
  const newAd = {
    enabled: document.getElementById('ad_enabled').checked,
    type: document.getElementById('ad_type').value,
    imageUrl: document.getElementById('ad_img').value.trim(),
    title: document.getElementById('ad_title').value.trim(),
    text: getRichEditorHTML('ad_text'),
    durationSec: Number(document.getElementById('ad_duration').value)||10
  };
  // שומרים את הפרסומת הקודמת בהיסטוריה (רק אם הייתה בעלת תוכן, ושונה מהחדשה)
  const prev = DB.settings.ad;
  const isDifferent = prev && (prev.title !== newAd.title || prev.text !== newAd.text || prev.imageUrl !== newAd.imageUrl);
  if(prev && (prev.title || prev.text || prev.imageUrl) && isDifferent){
    if(!DB.settings.adHistory) DB.settings.adHistory = [];
    DB.settings.adHistory.push({...prev, savedAt: new Date().toISOString()});
    if(DB.settings.adHistory.length > 30) DB.settings.adHistory = DB.settings.adHistory.slice(-30);
  }
  DB.settings.ad = newAd;
  const ok = await saveSettingsRow();

}

  DB.places.forEach(p=>{
    const addressPlain = stripHtmlTags(p.address);
    const directionsPlain = stripHtmlTags(p.directions);
    const namePlain = stripHtmlTags(p.nameHe);

    // 1) כתובת שכנראה מכילה תחילת "דרכי הגעה"
    const addrMatch = addressPlain.match(DQ_SPILLOVER_RE);
    if(addrMatch && addressPlain.length > 25){
      const idx = addrMatch.index;
      if(idx > 3){
        const cleanAddress = addressPlain.slice(0, idx).trim().replace(/[-,]\s*$/,'').trim();
        const spillover = addressPlain.slice(idx).trim();
        pushDqFinding(findings, p, 'address_spillover', 'כתובת מכילה כנראה תחילת "דרכי הגעה"',
          {address:cleanAddress, directions:(spillover+' '+directionsPlain).trim()});
      }
    }

    // 2) דרכי הגעה עם כפילות תווית "דרכי הגעה:" בתחילת הטקסט
    if(DQ_LABEL_DUP_RE.test(directionsPlain)){
      pushDqFinding(findings, p, 'directions_label_dup', 'שדה "דרכי הגעה" מתחיל בכפילות של המילה "דרכי הגעה"',
        {directions: directionsPlain.replace(DQ_LABEL_DUP_RE,'').trim()});
    }

    // 3) שם חשוד (ארוך מדי / מכיל מספרים כפולים / מכיל מילות "דרכי הגעה")
    const nameSpilloverMatch = namePlain.match(DQ_SPILLOVER_RE);
    const nameDupNumberMatch = namePlain.match(/(\d+)\s+\1\b/);
    const nameSuspicious = namePlain.length > 35 || nameSpilloverMatch || nameDupNumberMatch;
    if(nameSuspicious){
      let suggestedName = null;
      if(nameSpilloverMatch && nameSpilloverMatch.index > 3){
        suggestedName = namePlain.slice(0, nameSpilloverMatch.index).trim().replace(/[-,]\s*$/,'').trim();
      } else if(nameDupNumberMatch){
        suggestedName = namePlain.replace(/(\d+)\s+\1\b/, '$1').trim();
      }
      pushDqFinding(findings, p, 'name_suspicious', 'שם המקום נראה חשוד (ארוך/מכיל שברי כתובת)',
        suggestedName ? {nameHe: suggestedName} : null);
    }

    // 4) כל שדה טקסט חופשי אחר (לא רק כתובת) שמכיל כפילות של תווית "דרכי הגעה:" בתחילתו
    TEXT_FIELDS.filter(f=>f!=='directions').forEach(f=>{
      const plain = stripHtmlTags(p[f]);
      if(plain && DQ_LABEL_DUP_RE.test(plain)){
        pushDqFinding(findings, p, 'field_label_dup_'+f, `שדה "${DQ_FIELD_LABELS[f]}" מתחיל בכפילות של המילה "דרכי הגעה"`,
          {[f]: plain.replace(DQ_LABEL_DUP_RE,'').trim()});
      }
    });

    // 5) שדות חובה חסרים במקום מפורסם באתר לגולשים — עבור תיאור/דירוג ניתן להציע תיקון אוטומטי; שאר השדות (תמונה, כתובת וכו') דורשים מידע שלא קיים כלל ולא ניתן להשלים אוטומטית
    if(p.status === 'published'){
      const missingRequired = [];
      if(!namePlain) missingRequired.push('nameHe');
      if(!stripHtmlTags(p.category)) missingRequired.push('category');
      if(!stripHtmlTags(p.city)) missingRequired.push('city');
      if(!addressPlain) missingRequired.push('address');
      if(!stripHtmlTags(p.description)) missingRequired.push('description');
      if(!(p.images||[]).filter(Boolean).length) missingRequired.push('images');
      if(!p.rating) missingRequired.push('rating');
      if(!(p.lat && p.lng)) missingRequired.push('latlng');
      if(missingRequired.length){
        const autoFix = {};
        if(missingRequired.includes('description')){
          const suggestedDesc = buildDescriptionSuggestion({
            nameHe:p.nameHe, category:p.category, city:p.city, region:p.region,
            seating:p.seating, foodDrink:p.foodDrink, services:p.services, nearbyTrips:p.nearbyTrips, rating:p.rating
          });
          if(suggestedDesc) autoFix.description = suggestedDesc;
        }
        if(missingRequired.includes('rating')){
          autoFix.rating = suggestRatingFor(p, computeCompleteness(p));
        }
        pushDqFinding(findings, p, 'missing_required',
          `מקום מפורסם עם שדות חסרים: ${missingRequired.map(f=>DQ_FIELD_LABELS[f]).join(', ')}${Object.keys(autoFix).length?' (עבור חלק מהשדות יש הצעת תיקון אוטומטית למטה — שאר השדות דורשים השלמה ידנית)':''}`,
          Object.keys(autoFix).length ? autoFix : null);
      }
    }

    // 6) תוכן קצר במיוחד בשדה תיאור — ניתן להציע תיאור חלופי מבוסס שאר השדות
    const descPlain = stripHtmlTags(p.description);
    if(p.status==='published' && descPlain && descPlain.length < 20){
      const suggestedDesc = buildDescriptionSuggestion({
        nameHe:p.nameHe, category:p.category, city:p.city, region:p.region,
        seating:p.seating, foodDrink:p.foodDrink, services:p.services, nearbyTrips:p.nearbyTrips, rating:p.rating
      });
      pushDqFinding(findings, p, 'description_too_short', 'תיאור המקום קצר מאוד — כדאי להרחיב אותו כדי שיהיה שימושי לגולשים',
        suggestedDesc ? {description: suggestedDesc} : null);
    }

    // 7) דירוג מחוץ לטווח התקין (1-10) — ניתן להציע תיקון אוטומטי (עיגול לטווח התקין)
    if(p.rating && (p.rating < 1 || p.rating > 10)){
      const clamped = Math.min(10, Math.max(1, Math.round(p.rating)));
      pushDqFinding(findings, p, 'rating_out_of_range', `דירוג לא תקין (${p.rating}) — יש להזין ערך בין 1 ל-10`,
        {rating: clamped});
    }
  });

  if(!findings.length){
    statusEl.innerHTML = '';
    resultsEl.innerHTML = '<div class="form-success">לא נמצאו בעיות חשודות — הנתונים נראים תקינים!</div>';
    return;
  }
  statusEl.innerHTML = `<span class="small-note">נמצאו ${findings.length} ממצאים לבדיקה.</span>`;
  window._dqFindings = findings;
  resultsEl.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;">
      ${findings.map((f,i)=>renderDqFindingCard(f,i)).join('')}
    </div>
    <button class="btn btn-gold" style="width:100%;margin-top:16px;" onclick="applyDqFixes()"><i class="fa-solid fa-check-double"></i> החל את כל התיקונים המסומנים</button>
  `;
}

    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;">
      <div>
        <label style="display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer;">
          <input type="checkbox" id="dq_check_${i}" ${canAutoFix?'checked':''} ${canAutoFix?'':'disabled'}>
          ${escapeHtml(f.name)}
        </label>
        <div class="small-note" style="margin-top:2px;">${escapeHtml(f.label)}</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="openPlaceModal('${f.id}')">פתיחה לעריכה ידנית</button>
    </div>
    ${canAutoFix ? `
      <div class="grid-2" style="gap:10px;">
        ${Object.keys(f.suggested).map(key=>{
          const meta = DQ_EDITABLE_FIELD_META[key] || {label:key, type:'text'};
          const currentVal = (f.current[key]!=null && f.current[key]!=='') ? stripHtmlTags(String(f.current[key])) : '(ריק)';
          const suggestedVal = f.suggested[key];
          const inputId = `dq_fix_${i}_${key}`;
          let inputHTML;
          if(meta.type==='textarea'){
            inputHTML = `<textarea id="${inputId}" style="font-size:12.5px;min-height:60px;">${escapeHtml(String(suggestedVal))}</textarea>`;
          } else if(meta.type==='number'){
            inputHTML = `<input id="${inputId}" type="number" min="1" max="10" value="${escapeHtml(String(suggestedVal))}" style="font-size:12.5px;">`;
          } else {
            inputHTML = `<input id="${inputId}" value="${escapeHtml(String(suggestedVal))}" style="font-size:12.5px;">`;
          }
          return `<div>
            <div class="small-note" style="margin-bottom:2px;">${escapeHtml(meta.label)} נוכחי/ת:</div>
            <div style="background:#fdf5e6;border-radius:6px;padding:6px 8px;font-size:12.5px;margin-bottom:6px;max-height:70px;overflow-y:auto;">${escapeHtml(currentVal)}</div>
            <div class="small-note" style="margin-bottom:2px;">${escapeHtml(meta.label)} מוצע/ת (ניתן לערוך לפני אישור):</div>
            ${inputHTML}
          </div>`;
        }).join('')}
      </div>` : `<p class="small-note" style="color:#a33;">אין הצעת תיקון אוטומטית עבור ממצא זה — הפריט חסר לגמרי (למשל תמונה או תיאור), ואי אפשר להשלים אותו בשבילכם. יש לפתוח לעריכה ידנית.</p>`}
  </div>`;
}

async function applyDqFixes(){
  const findings = window._dqFindings || [];
  const statusEl = document.getElementById('dqStatus');
  let applied = 0;
  for(let i=0;i<findings.length;i++){
    const f = findings[i];
    if(!f.suggested) continue;
    const checkbox = document.getElementById(`dq_check_${i}`);
    if(!checkbox || !checkbox.checked) continue;
    const place = DB.places.find(x=>x.id===f.id);
    if(!place) continue;
    Object.keys(f.suggested).forEach(key=>{
      const inputEl = document.getElementById(`dq_fix_${i}_${key}`);
      const meta = DQ_EDITABLE_FIELD_META[key] || {type:'text'};
      let val = inputEl ? inputEl.value : f.suggested[key];
      if(meta.type==='number') val = Math.min(10, Math.max(1, Number(val)||1));
      else val = String(val).trim();
      place[key] = val;
    });
    const ok = await upsertPlaceRow(place);
    if(ok) applied++;
  }
  statusEl.innerHTML = `<div class="form-success">בוצעו ${applied} תיקונים בהצלחה.</div>`;
  document.getElementById('dqResults').innerHTML = '';
}

async function geocodeAllPlaces(){
  const statusEl = document.getElementById('geocodeAllStatus');
  const missing = DB.places.filter(p => !(p.lat && p.lng) && (p.address || p.city));
  if(!missing.length){
    statusEl.innerHTML = '<div class="form-success">כל המקומות כבר כוללים מיקום מדויק — אין צורך בעדכון.</div>';
    return;
  }
  if(!confirm(`נמצאו ${missing.length} מקומות ללא מיקום מדויק. לאתר עבורם קואורדינטות עכשיו? הפעולה עשויה לקחת כמה דקות (יש להשאיר את הדף פתוח).`)) return;
  let done=0, failed=0;
  for(const place of missing){
    statusEl.innerHTML = `<span class="small-note"><i class="fa-solid fa-spinner fa-spin"></i> מאתר מיקום: ${done+failed+1}/${missing.length} — ${escapeHtml(place.nameHe)}</span>`;
    const query = [place.address, place.city, 'ישראל'].filter(Boolean).join(', ');
    try{
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'he' } });
      const data = await res.json();
      if(data && data.length){
        place.lat = parseFloat(data[0].lat);
        place.lng = parseFloat(data[0].lon);
        const ok = await upsertPlaceRow(place);
        if(ok) done++; else failed++;
      } else {
        failed++;
      }
    }catch(err){
      console.error('geocode failed for', place.nameHe, err);
      failed++;
    }
    // המתנה קצרה בין בקשות, בהתאם למדיניות השימוש ההוגן של שירות המיקום החינמי
    await new Promise(r=>setTimeout(r, 1100));
  }
  statusEl.innerHTML = `<div class="form-success">עודכנו בהצלחה ${done} מקומות. ${failed?`${failed} מקומות לא נמצאו אוטומטית ונדרש עדכון ידני עבורם (לרוב בגלל כתובת חלקית או לא מדויקת).`:''}</div>`;
}
/* בדיקת תמונות שבורות: יוצרים אובייקט Image() לכל תמונה ומחכים לאירוע load/error —
   זו הדרך האמינה ביותר לבדוק תמונות חוצות-מקור בצד הדפדפן, בלי להיתקל בחסימות CORS. */
function scanBrokenImages(){
  const statusEl = document.getElementById('brokenImgStatus');
  const checks = [];
  DB.places.forEach(p=>{
    (p.images||[]).forEach(url=>{
      if(url) checks.push({placeId:p.id, placeName:p.nameHe, url});
    });
  });
  if(!checks.length){
    statusEl.innerHTML = '<p class="small-note">אין תמונות במאגר לבדיקה.</p>';
    return;
  }
  statusEl.innerHTML = `<p class="small-note"><i class="fa-solid fa-spinner fa-spin"></i> בודק ${checks.length} תמונות...</p>`;
  let done = 0;
  let finished = false;
  const broken = [];
  const finish = ()=>{
    if(finished) return;
    finished = true;
    if(!broken.length){
      statusEl.innerHTML = `<div class="form-success">נבדקו ${checks.length} תמונות — כולן תקינות!</div>`;
      return;
    }
    statusEl.innerHTML = `<div class="form-error" style="margin-bottom:10px;">נמצאו ${broken.length} תמונות שבורות מתוך ${checks.length}:</div>
      <div style="display:flex;flex-direction:column;gap:6px;">
      ${broken.map(b=>`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1e7ce;padding:6px 0;flex-wrap:wrap;gap:8px;">
        <span>${escapeHtml(b.placeName)}</span>
        <span class="small-note" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(b.url)}</span>
        <button class="btn btn-outline btn-sm" onclick="openPlaceModal('${b.placeId}')">פתיחה לתיקון</button>
      </div>`).join('')}
      </div>`;
  };
  checks.forEach(c=>{
    const img = new Image();
    img.onload = ()=>{ done++; if(done===checks.length) finish(); };
    img.onerror = ()=>{ broken.push(c); done++; if(done===checks.length) finish(); };
    img.src = c.url;
  });
  setTimeout(finish, 20000); // רשת איטית מאוד — לא תוקעים את הכלי לנצח, פשוט מציגים מה שהתברר עד כה
}
async function migrateHeavyImages(){
  const statusEl = document.getElementById('migrateImagesStatus');
  const heavyPlaces = DB.places.filter(p => (p.images||[]).some(u => u && u.startsWith('data:')));
  if(!heavyPlaces.length){
    statusEl.innerHTML = '<div class="form-success">אין תמונות כבדות להמרה — הכל כבר קליל ומהיר.</div>';
    return;
  }
  if(!confirm(`נמצאו ${heavyPlaces.length} מקומות עם תמונות כבדות. להמיר אותן עכשיו? (פעולה חד-פעמית, בטוחה)`)) return;
  let done = 0, failed = 0;
  for(const place of heavyPlaces){
    statusEl.innerHTML = `<span class="small-note"><i class="fa-solid fa-spinner fa-spin"></i> ממיר תמונות: ${done+failed}/${heavyPlaces.length} (${escapeHtml(place.nameHe)})</span>`;
    const newImages = [];
    for(const url of (place.images||[])){
      if(!url) continue;
      if(!url.startsWith('data:')){ newImages.push(url); continue; }
      try{
        const resp = await fetch(url);
        const blob = await resp.blob();
        const path = `migrated-${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
        const { error } = await sb.storage.from('place-images').upload(path, blob, { contentType:'image/jpeg' });
        if(error) throw error;
        const { data } = sb.storage.from('place-images').getPublicUrl(path);
        newImages.push(data.publicUrl);
      }catch(err){
        console.error('migration failed for', place.nameHe, err);
        newImages.push(url); // נשאיר את המקורי אם ההעלאה נכשלה, כדי לא לאבד את התמונה
      }
    }
    place.images = newImages;
    const ok = await upsertPlaceRow(place);
    if(ok) done++; else failed++;
  }
  statusEl.innerHTML = `<div class="form-success">הומרו בהצלחה ${done} מקומות${failed?` (${failed} נכשלו ונשארו כפי שהיו)`:''}. האתר אמור להיטען מהר יותר עכשיו.</div>`;
}
async function importPlacesFromJson(){
  const raw = document.getElementById('import_json').value.trim();
  const msgArea = document.getElementById('importMsgArea');
  if(!raw){ msgArea.innerHTML = '<div class="form-error">נא להדביק תוכן JSON לפני הייבוא.</div>'; return; }
  let arr;
  try{ arr = JSON.parse(raw); if(!Array.isArray(arr)) throw new Error('not-array'); }
  catch(e){ msgArea.innerHTML = '<div class="form-error">תוכן ה-JSON אינו תקין. יש לוודא שמדובר במערך תקין.</div>'; return; }
  const existingKeys = new Set(DB.places.map(p => (p.nameHe||'').trim()+'|'+(p.city||'').trim()));
  let nextOrder = DB.places.reduce((m,p)=>Math.max(m, p.order||0), 0) + 1;
  let added = 0, skipped = 0;
  const newPlaces = [];
  arr.forEach(h => {
    const nameHe = (h.nameHe||'').trim();
    const city = (h.city||'').trim();
    if(!nameHe || !city){ skipped++; return; }
    const key = nameHe+'|'+city;
    if(existingKeys.has(key)){ skipped++; return; }
    const newPlace = {
      id: h.id || uid(),
      nameHe, nameEn: h.nameEn||'', category: h.category||'אחר',
      city, region: h.region||'', address: h.address||'',
      description: h.description||'', directions: h.directions||'',
      seating: h.seating||'', foodDrink: h.foodDrink||'', services: h.services||'',
      payment: h.payment||'', nearbyTrips: h.nearbyTrips||'', notes: h.notes||'',
      rating: h.rating||5, ratingLabel: h.ratingLabel||'',
      images: h.images||[], mainImage: h.mainImage||null,
      lat: h.lat||null, lng: h.lng||null,
      status: h.status||'draft', order: nextOrder++,
      updatedAt: new Date().toISOString().slice(0,10)
    };
    newPlaces.push(newPlace);
    existingKeys.add(key);
    added++;
  });
  if(newPlaces.length){
    const rows = newPlaces.map(placeObjToRow);
    const { error } = await sb.from('places').upsert(rows, {onConflict:'id'});
    if(error){ msgArea.innerHTML = '<div class="form-error">הייבוא נכשל: '+escapeHtml(error.message)+'</div>'; return; }
    DB.places.push(...newPlaces);
  }
  msgArea.innerHTML = `<div class="form-success">יובאו ${added} מקומות חדשים (כטיוטה). ${skipped? skipped+' נדלגו (כפילות או שדות חסרים).':''}</div>`;
  document.getElementById('import_json').value = '';
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'zman-simchateinu-backup.json';
  a.click();
  URL.revokeObjectURL(url);
}

async function urlToDataUri(url){
  try{
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }catch(e){
    return null; // אם התמונה חסומה להעתקה (CORS) — נשאיר את הקישור המקורי, שיעבוד רק כשיש אינטרנט
  }
}

async function downloadOfflineVersion(){
  const statusEl = document.getElementById('offlineExportStatus');
  const published = DB.places.filter(p=>p.status==='published');
  if(!published.length){
    statusEl.innerHTML = '<div class="form-error">אין עדיין מקומות מפורסמים לייצוא.</div>';
    return;
  }
  const MAX_IMAGES_PER_PLACE = 3;
  const lite = [];
  let done = 0;
  for(const p of published){
    statusEl.innerHTML = `<span class="small-note"><i class="fa-solid fa-spinner fa-spin"></i> מכין מקום ${done+1}/${published.length} (מטמיע תמונות לשימוש אופליין)...</span>`;
    const srcImages = (p.images||[]).filter(Boolean).slice(0, MAX_IMAGES_PER_PLACE);
    const images = [];
    for(const url of srcImages){
      const dataUri = url.startsWith('data:') ? url : await urlToDataUri(url);
      images.push(dataUri || url);
    }
    let mapImage = null;
    if(p.lat && p.lng){
      const staticUrl = buildStaticMapUrl(p.lat,p.lng,420,260,15);
      mapImage = await urlToDataUri(staticUrl);
    }
    lite.push({
      nameHe:p.nameHe, nameEn:p.nameEn||'', category:p.category, city:p.city, region:p.region||'',
      address:p.address||'', description:stripHtmlTags(p.description), directions:stripHtmlTags(p.directions),
      seating:stripHtmlTags(p.seating), foodDrink:stripHtmlTags(p.foodDrink), services:stripHtmlTags(p.services),
      payment:stripHtmlTags(p.payment), nearbyTrips:stripHtmlTags(p.nearbyTrips), notes:stripHtmlTags(p.notes),
      rating:p.rating||null, ratingLabel:p.ratingLabel||'', images, mapImage
    });
    done++;
  }
  statusEl.innerHTML = '<span class="small-note"><i class="fa-solid fa-spinner fa-spin"></i> בונה את הקובץ...</span>';
  const html = buildOfflineHTML(lite);
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `זמן-שמחתנו-אופליין-${dateStr}.html`;
  a.click();
  URL.revokeObjectURL(url);
  statusEl.innerHTML = `<div class="form-success">הקובץ ירד בהצלחה (${lite.length} מקומות). ניתן לפתוח אותו בכל דפדפן, גם ללא אינטרנט.</div>`;
}

function buildOfflineHTML(places){

  return `<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--cream:#FAF5E8;--wood:#4A3221;--wood-dark:#2E1D12;--gold:#B08A3E;--gold-pale:#EFE1BC;--ink:#39291A;--muted:#8A7454;--line:#E3D6B4;}
*{box-sizing:border-box;} body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,'Segoe UI',sans-serif;line-height:1.6;}
header{background:var(--wood-dark);color:var(--gold-pale);padding:14px 20px;text-align:center;}
header h1{margin:0;font-size:19px;} header p{margin:4px 0 0;font-size:12px;color:#D9BE7C;}
.offline-note{background:#F1E7CE;color:#6a4b16;padding:10px 16px;text-align:center;font-size:13px;}
.container{max-width:1100px;margin:0 auto;padding:20px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;background:#fff;padding:14px;border-radius:10px;border:1px solid var(--line);}
.filters input,.filters select{flex:1;min-width:140px;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;}
.card:hover{border-color:var(--gold);box-shadow:0 4px 14px rgba(46,29,18,.12);}
.card img{width:100%;height:150px;object-fit:cover;display:block;background:var(--gold-pale);}
.card .noimg{width:100%;height:150px;background:var(--gold-pale);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:13px;}
.card .body{padding:12px;}
.card h3{margin:0 0 4px;font-size:15.5px;color:var(--wood-dark);}
.card .meta{font-size:12px;color:var(--muted);margin-bottom:6px;}
.card .rating{display:inline-block;background:var(--gold-pale);color:#6a4b16;border-radius:20px;padding:2px 10px;font-size:11.5px;}

.detail-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}

</style></head>
<body>
<header><h1>זמן שמחתנו — מאגר מידע לפגישות (גרסה אופליין)</h1><p>ועד השמחות ישיבת עטרת שלמה · הופק בתאריך ${genDate}</p></header>
<div class="offline-note">קובץ זה עובד ללא אינטרנט. הוא תמונת מצב מהמאגר מרגע ההורדה — לעדכונים חדשים יש להוריד גרסה מעודכנת מהאתר החי.</div>

  <div class="detail-box" id="detailBox"></div>
</div>
<script>
const PLACES = ${JSON.stringify(places)};
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function renderGrid(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const cat = document.getElementById('fCat').value;
  const city = document.getElementById('fCity').value;
  let list = PLACES.filter(p=>{
    if(cat && p.category!==cat) return false;
    if(city && p.city!==city) return false;
    if(q){
      const hay = [p.nameHe,p.nameEn,p.city,p.region,p.description,p.directions,p.seating,p.foodDrink,p.notes].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const grid = document.getElementById('grid');
  if(!list.length){ grid.innerHTML = '<div class="empty">לא נמצאו מקומות תואמים.</div>'; return; }
  grid.innerHTML = list.map((p,i)=>{
    const idx = PLACES.indexOf(p);
    const img = p.images && p.images[0] ? '<img src="'+p.images[0]+'">' : '<div class="noimg">אין תמונה</div>';
    return '<div class="card" onclick="openDetail('+idx+')">'+img+
      '<div class="body"><h3>'+esc(p.nameHe)+'</h3><div class="meta">'+esc(p.city)+' · '+esc(p.category)+'</div>'+
      (p.rating?'<span class="rating">'+p.rating+'/10</span>':'')+'</div></div>';
  }).join('');
}
function openDetail(idx){
  const p = PLACES[idx];
  const sections = [
    ['תיאור המקום', p.description], ['כתובת', p.address],
    ['מקומות ישיבה', p.seating], ['שתייה ואוכל', p.foodDrink], ['שירותים', p.services],
    ['תשלום', p.payment], ['מקומות טיול בסביבה', p.nearbyTrips], ['הערות והמלצות', p.notes],
  ].filter(s=>s[1] && s[1].trim());
  const imgs = (p.images||[]).concat(p.mapImage?[p.mapImage]:[]);
  document.getElementById('detailBox').innerHTML =
    '<button class="close" onclick="closeDetail()">×</button>'+
    '<h2>'+esc(p.nameHe)+(p.nameEn?' <span style="color:#8A7454;font-weight:400;font-size:15px;">'+esc(p.nameEn)+'</span>':'')+'</h2>'+
    '<div class="sub">'+esc(p.category)+' · '+esc(p.city)+' · '+esc(p.region)+(p.rating?' · דירוג: '+p.rating+'/10':'')+'</div>'+
    (imgs.length?'<div class="detail-imgs">'+imgs.map(u=>'<img src="'+u+'">').join('')+'</div>':'')+
    sections.map(s=>'<div class="d-sec"><h4>'+s[0]+'</h4><p>'+esc(s[1])+'</p></div>').join('');
  document.getElementById('detailOverlay').classList.add('show');
}
function closeDetail(){ document.getElementById('detailOverlay').classList.remove('show'); }
renderGrid();
<\/script>
</body></html>`;
}
</script>
